<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>毕业地图 · 在地球上见</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <style>
        /* ===== 全局 ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-primary: #f5f0ea;
            --bg-card: rgba(255,253,250,0.75);
            --bg-card-solid: #fffdfa;
            --bg-input: #f8f5f0;
            --bg-hover: #eee8e0;
            --border-light: rgba(210,200,188,0.4);
            --border-medium: #d2c8bc;
            --text-primary: #2c2520;
            --text-secondary: #6b5f52;
            --text-muted: #9a8b7a;
            --accent-blue: #4d8f9e;
            --accent-red: #c45a4a;
            --accent-gold: #b8a08a;
            --shadow-sm: 0 2px 10px rgba(44,37,32,0.06);
            --shadow-md: 0 6px 30px rgba(44,37,32,0.08);
            --shadow-lg: 0 12px 50px rgba(44,37,32,0.14);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition: 0.3s cubic-bezier(0.34,1.56,0.64,1);
            --font-sans: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
            --font-serif: "Georgia","Noto Serif SC","Songti SC",serif;
        }
        html,body { height:100%; overflow:hidden; }
        body {
            background: var(--bg-primary);
            background-image: radial-gradient(circle at 20% 30%, rgba(210,200,188,0.15) 0%, transparent 60%),
            radial-gradient(circle at 80% 70%, rgba(180,170,158,0.10) 0%, transparent 50%);
            font-family: var(--font-sans);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--border-medium); border-radius:20px; }
        ::-webkit-scrollbar-thumb:hover { background:var(--text-muted); }
        .header {
            height:76px; padding:0 32px; display:flex; align-items:center; justify-content:space-between;
            background:rgba(255,253,250,0.70); backdrop-filter:blur(16px) saturate(1.2);
            -webkit-backdrop-filter:blur(16px) saturate(1.2); border-bottom:1px solid rgba(210,200,188,0.25);
            position:relative; z-index:20; flex-shrink:0;
        }
        .header::after {
            content:''; position:absolute; bottom:0; left:10%; right:10%; height:1px;
            background:linear-gradient(90deg,transparent,rgba(210,200,188,0.4),transparent);
        }
        .header-left h2 { font-family:var(--font-serif); font-size:22px; font-weight:600; letter-spacing:2px; color:var(--text-primary); }
        .header-left h2 span { color:var(--accent-red); font-weight:700; }
        .header-left p { font-size:12px; color:var(--text-muted); letter-spacing:2px; margin-top:1px; }
        .header-right { display:flex; align-items:center; gap:16px; font-size:13px; }
        .user-info { color:var(--text-secondary); padding:5px 16px; background:rgba(255,255,255,0.5); backdrop-filter:blur(4px); border-radius:30px; font-size:13px; border:1px solid rgba(210,200,188,0.2); }
        .logout-btn { padding:6px 20px; border:1px solid rgba(210,200,188,0.4); border-radius:30px; background:transparent; color:var(--text-secondary); cursor:pointer; font-size:12px; transition:all var(--transition); backdrop-filter:blur(4px); }
        .logout-btn:hover { background:var(--text-primary); color:#fff; border-color:var(--text-primary); transform:translateY(-1px); box-shadow:var(--shadow-sm); }
        .main { display:flex; height:calc(100vh - 76px); gap:0; background:transparent; }
        .map-container { flex:1; position:relative; min-width:0; }
        #map { width:100%; height:100%; border-radius:0; }
        .map-back-btn {
            position:absolute; top:20px; left:24px; padding:8px 20px;
            background:rgba(255,253,250,0.80); backdrop-filter:blur(10px);
            border:1px solid rgba(210,200,188,0.3); border-radius:30px;
            cursor:pointer; font-size:12px; color:var(--text-secondary);
            display:none; z-index:10; transition:all var(--transition);
            box-shadow:var(--shadow-sm);
        }
        .map-back-btn:hover { background:#fff; border-color:var(--border-medium); box-shadow:var(--shadow-md); transform:translateY(-2px); }
        .map-loading {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            color:var(--text-secondary); font-size:13px; z-index:9;
            background:rgba(255,253,250,0.90); backdrop-filter:blur(12px);
            padding:18px 36px; border-radius:var(--radius-md);
            border:1px solid rgba(210,200,188,0.2); display:none;
            text-align:center; line-height:1.8; box-shadow:var(--shadow-lg);
        }
        .map-loading button { margin-top:10px; padding:5px 18px; border:1px solid var(--border-medium); background:#fff; border-radius:30px; color:var(--text-secondary); cursor:pointer; font-size:12px; transition:all var(--transition); }
        .map-loading button:hover { background:var(--text-primary); color:#fff; border-color:var(--text-primary); }
        .map-stats { position:absolute; bottom:32px; left:32px; z-index:5; pointer-events:none; }
        .map-stats .en { font-size:11px; color:var(--text-muted); letter-spacing:3px; text-transform:uppercase; opacity:0.7; }
        .map-stats .cn { font-size:28px; font-weight:600; letter-spacing:3px; font-family:var(--font-serif); color:var(--text-primary); text-shadow:0 2px 8px rgba(255,253,250,0.3); }
        .map-stats .count { font-size:20px; color:var(--accent-red); font-weight:700; margin-left:4px; font-family:var(--font-sans); }
        .sidebar {
            width:370px; background:rgba(255,253,250,0.60); backdrop-filter:blur(20px) saturate(1.3);
            -webkit-backdrop-filter:blur(20px) saturate(1.3); border-left:1px solid rgba(210,200,188,0.2);
            padding:24px 22px; overflow-y:auto; flex-shrink:0; display:flex; flex-direction:column;
        }
        .tab-bar { display:flex; gap:4px; margin-bottom:22px; padding:4px; background:rgba(255,255,255,0.4); backdrop-filter:blur(4px); border-radius:var(--radius-md); flex-shrink:0; border:1px solid rgba(210,200,188,0.15); }
        .tab-item { flex:1; text-align:center; padding:9px 0; font-size:13px; cursor:pointer; border-radius:var(--radius-sm); color:var(--text-muted); transition:all var(--transition); user-select:none; }
        .tab-item:hover { color:var(--text-secondary); }
        .tab-item.active { background:#ffffff; color:var(--text-primary); box-shadow:var(--shadow-sm); font-weight:500; }
        .admin-tab { display:none; }
        .search-box { margin-bottom:16px; flex-shrink:0; display:flex; gap:8px; }
        .search-box input { flex:1; padding:10px 16px; border:1px solid rgba(210,200,188,0.25); border-radius:30px; background:rgba(255,255,255,0.6); backdrop-filter:blur(4px); font-size:13px; color:var(--text-primary); outline:none; font-family:var(--font-sans); transition:all var(--transition); }
        .search-box input:focus { border-color:var(--accent-blue); box-shadow:0 0 0 4px rgba(77,143,158,0.12); background:#ffffff; }
        .search-box input::placeholder { color:var(--text-muted); }
        .search-btn { padding:8px 16px; border:1px solid rgba(210,200,188,0.3); border-radius:30px; background:rgba(255,255,255,0.6); cursor:pointer; font-size:13px; color:var(--text-secondary); transition:all var(--transition); white-space:nowrap; }
        .search-btn:hover { background:#fff; border-color:var(--accent-blue); color:var(--text-primary); }
        .classmates-list { flex:1; overflow-y:auto; padding-right:4px; }
        .classmates-list .empty { text-align:center; color:var(--text-muted); padding:48px 0; font-size:13px; }
        .classmate-item { padding:14px 18px; border:1px solid rgba(210,200,188,0.15); border-radius:var(--radius-md); margin-bottom:10px; background:rgba(255,255,255,0.50); backdrop-filter:blur(4px); cursor:pointer; transition:all var(--transition); position:relative; }
        .classmate-item:hover { background:rgba(255,255,255,0.85); border-color:rgba(210,200,188,0.4); transform:translateX(4px) translateY(-2px); box-shadow:var(--shadow-md); }
        .classmate-item:active { transform:scale(0.98); }
        .classmate-name { font-size:15px; font-weight:600; color:var(--text-primary); margin-bottom:2px; font-family:var(--font-serif); }
        .classmate-loc { font-size:12px; color:var(--text-muted); margin-bottom:6px; letter-spacing:0.3px; }
        .classmate-msg { font-size:12.5px; color:var(--text-secondary); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-overflow:ellipsis; }
        .like-area { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; color:var(--text-muted); }
        .like-btn { background:none; border:none; cursor:pointer; font-size:18px; color:var(--text-muted); transition:all 0.2s; }
        .like-btn:hover { transform:scale(1.25); }
        .like-btn.liked { color:var(--accent-red); animation:likePop 0.35s ease; }
        @keyframes likePop { 0%{transform:scale(1);} 40%{transform:scale(1.5);} 70%{transform:scale(0.9);} 100%{transform:scale(1);} }
        .like-count,.comment-count { user-select:none; }
        .comment-count { margin-left:4px; color:var(--text-muted); }
        #selfPanel { flex:1; display:flex; flex-direction:column; overflow-y:auto; padding-right:4px; }
        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-size:12px; font-weight:500; color:var(--text-secondary); margin-bottom:4px; letter-spacing:0.5px; }
        .form-group input,.form-group textarea,.form-group select { width:100%; padding:9px 14px; border:1px solid rgba(210,200,188,0.25); border-radius:var(--radius-sm); background:rgba(255,255,255,0.5); backdrop-filter:blur(4px); font-size:13px; color:var(--text-primary); outline:none; font-family:var(--font-sans); transition:all var(--transition); }
        .form-group input:focus,.form-group textarea:focus,.form-group select:focus { border-color:var(--accent-blue); box-shadow:0 0 0 4px rgba(77,143,158,0.10); background:#ffffff; }
        .form-group textarea { resize:vertical; min-height:60px; line-height:1.6; }
        .save-btn { width:100%; padding:11px; background:linear-gradient(135deg,var(--text-primary),#3d322b); color:#fff; border:none; border-radius:var(--radius-sm); cursor:pointer; font-size:13px; font-weight:500; letter-spacing:1.5px; margin-top:4px; transition:all var(--transition); box-shadow:0 2px 8px rgba(44,37,32,0.15); }
        .save-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 6px 20px rgba(44,37,32,0.20); }
        .save-btn:disabled { opacity:0.5; cursor:not-allowed; }
        .cancel-btn { width:100%; padding:11px; background:rgba(255,255,255,0.3); color:var(--text-secondary); border:1px solid rgba(210,200,188,0.3); border-radius:var(--radius-sm); cursor:pointer; font-size:13px; margin-top:6px; transition:all var(--transition); backdrop-filter:blur(4px); }
        .cancel-btn:hover { background:rgba(255,255,255,0.6); border-color:var(--text-muted); }
        #adminPanel { flex:1; display:flex; flex-direction:column; overflow-y:auto; padding-right:4px; }
        .add-user-btn { width:100%; padding:11px; border:1.5px dashed rgba(210,200,188,0.4); background:rgba(255,255,255,0.2); color:var(--text-secondary); border-radius:var(--radius-sm); cursor:pointer; font-size:13px; margin-bottom:16px; transition:all var(--transition); letter-spacing:0.5px; backdrop-filter:blur(4px); }
        .add-user-btn:hover { background:rgba(255,255,255,0.5); border-style:solid; border-color:var(--accent-blue); color:var(--text-primary); }
        .user-list { flex:1; overflow-y:auto; }
        .user-item { padding:12px 16px; border:1px solid rgba(210,200,188,0.15); border-radius:var(--radius-md); margin-bottom:10px; background:rgba(255,255,255,0.40); backdrop-filter:blur(4px); transition:all var(--transition); }
        .user-item:hover { border-color:rgba(210,200,188,0.3); box-shadow:var(--shadow-sm); background:rgba(255,255,255,0.7); }
        .user-item .name-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
        .user-item .name { font-size:14px; font-weight:600; font-family:var(--font-serif); }
        .user-item .role { font-size:11px; padding:2px 12px; border-radius:20px; background:rgba(210,200,188,0.2); color:var(--text-secondary); }
        .user-item .loc { font-size:12px; color:var(--text-muted); margin-bottom:8px; }
        .user-item .ops { display:flex; gap:6px; flex-wrap:wrap; }
        .user-item .ops button { flex:1; min-width:44px; padding:5px 0; font-size:12px; border:1px solid rgba(210,200,188,0.2); background:rgba(255,255,255,0.2); border-radius:var(--radius-sm); cursor:pointer; color:var(--text-secondary); transition:all var(--transition); backdrop-filter:blur(4px); }
        .user-item .ops button:hover { background:rgba(255,255,255,0.6); border-color:var(--border-medium); }
        .user-item .ops button:last-child:hover { background:rgba(196,90,74,0.10); border-color:var(--accent-red); color:var(--accent-red); }
        .modal-mask { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(44,37,32,0.35); backdrop-filter:blur(10px); display:none; z-index:9999; animation:fadeIn 0.3s; }
        @keyframes fadeIn { 0%{opacity:0;} 100%{opacity:1;} }
        @keyframes slideUpElastic { 0%{opacity:0;transform:translate(-50%,-45%) scale(0.94);} 60%{transform:translate(-50%,-52%) scale(1.01);} 100%{opacity:1;transform:translate(-50%,-50%) scale(1);} }
        .modal-content { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(255,253,250,0.95); backdrop-filter:blur(20px); padding:30px 34px; border-radius:var(--radius-lg); width:440px; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow-lg); z-index:10000; animation:slideUpElastic 0.4s; border:1px solid rgba(255,255,255,0.3); }
        .modal-title { font-size:19px; font-weight:600; margin-bottom:20px; color:var(--text-primary); text-align:center; letter-spacing:2px; font-family:var(--font-serif); }
        .modal-btns { display:flex; gap:10px; margin-top:6px; }
        .modal-btns button { flex:1; }
        .form-tip { font-size:11px; color:var(--text-muted); margin-top:3px; }
        .detail-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .detail-name { font-size:20px; font-weight:600; font-family:var(--font-serif); }
        .detail-loc { font-size:13px; color:var(--text-muted); margin-bottom:12px; }
        .detail-msg { background:rgba(255,255,255,0.5); backdrop-filter:blur(4px); padding:16px 18px; border-radius:var(--radius-sm); margin-bottom:16px; line-height:1.7; font-size:14px; border:1px solid rgba(210,200,188,0.15); }
        .detail-msg .like-area { margin-top:12px; padding-top:12px; border-top:1px solid rgba(210,200,188,0.2); }
        .comment-list { margin-top:12px; max-height:260px; overflow-y:auto; border-top:1px solid rgba(210,200,188,0.15); padding-top:12px; }
        .comment-item { padding:10px 0; border-bottom:1px solid rgba(210,200,188,0.1); }
        .comment-item:last-child { border-bottom:none; }
        .comment-author { font-weight:500; font-size:13px; margin-bottom:2px; display:flex; justify-content:space-between; align-items:center; color:var(--text-primary); }
        .comment-author .comment-time { font-size:11px; color:var(--text-muted); }
        .comment-content { font-size:13px; color:var(--text-secondary); line-height:1.5; margin-bottom:4px; word-break:break-word; }
        .comment-delete { font-size:11px; color:var(--accent-red); cursor:pointer; background:none; border:none; padding:0 6px; }
        .comment-delete:hover { color:#a04030; }
        .comment-reply-btn { font-size:11px; color:var(--accent-blue); cursor:pointer; background:none; border:none; margin-left:4px; padding:0 6px; }
        .comment-reply-btn:hover { color:#3a7a88; }
        .reply-item { margin-left:18px; border-left:2px solid rgba(210,200,188,0.2); padding-left:14px; }
        .comment-input-area { margin-top:14px; display:flex; gap:10px; align-items:flex-end; }
        .comment-input-area textarea { flex:1; padding:8px 14px; border:1px solid rgba(210,200,188,0.2); border-radius:var(--radius-sm); background:rgba(255,255,255,0.4); font-size:13px; resize:none; height:40px; outline:none; }
        .comment-input-area textarea:focus { border-color:var(--accent-blue); background:#ffffff; }
        .comment-input-area button { padding:0 22px; height:40px; background:linear-gradient(135deg,var(--text-primary),#3d322b); color:#fff; border:none; border-radius:var(--radius-sm); cursor:pointer; font-size:13px; }
        .comment-input-area button:hover:not(:disabled) { transform:translateY(-2px); }
        .comment-input-area button:disabled { opacity:0.5; cursor:not-allowed; }
        .detail-close-btn { background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-muted); padding:4px 10px; border-radius:var(--radius-sm); transition:all var(--transition); }
        .detail-close-btn:hover { background:rgba(210,200,188,0.15); color:var(--text-primary); }
        #detailTeacherTip { display:none; color:var(--text-muted); text-align:center; padding:32px 0; font-size:14px; }
        /* 响应式略…… */ /* 省略部分响应式样式以节省篇幅，实际使用时保留原有完整响应式 */
    </style>
</head>
<body>
<div class="header">
    <div class="header-left"><h2>学军紫金港2025届4班 · <span>毕业地图</span></h2><p>班主任：王畅</p></div>
    <div class="header-right">
        <span class="user-info" id="currentUserName"></span>
        <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>
</div>

<div class="main">
    <div class="map-container">
        <button class="map-back-btn" id="backBtn" onclick="goBack()">← 返回</button>
        <div class="map-loading" id="mapLoading">地图加载中…</div>
        <div id="map"></div>
        <div class="map-stats">
            <div class="en">PEOPLE AROUND THE WORLD</div>
            <div class="cn">在地球上遇见 <span class="count" id="totalCount">0</span> 位</div>
        </div>
    </div>

    <div class="sidebar">
        <div class="tab-bar">
            <div class="tab-item active" onclick="switchTab('classmates')">同学列表</div>
            <div class="tab-item" onclick="switchTab('self')">我的信息</div>
            <div class="tab-item admin-tab" id="adminTab" onclick="switchTab('admin')">用户管理</div>
        </div>

        <div id="classmatesPanel" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索同学姓名…" oninput="filterClassmates(this.value)">
                <input type="text" id="locSearchInput" placeholder="输入地址定位…" style="flex:1;">
                <button class="search-btn" onclick="searchAndLocate()">🔍 定位</button>
            </div>
            <div class="classmates-list" id="classmatesList"></div>
        </div>

        <div id="selfPanel" style="display:none;">
            <div class="form-group"><label>姓名 <span style="color:var(--accent-red);">*</span></label><input type="text" id="editName"></div>
            <div class="form-group"><label>国家 <span style="color:var(--accent-red);">*</span></label><input type="text" id="editCountry"></div>
            <div class="form-group"><label>省份</label><input type="text" id="editProvince" placeholder="国内填写"></div>
            <div class="form-group"><label>城市</label><input type="text" id="editCity"></div>
            <div class="form-group"><label>区县</label><input type="text" id="editDistrict" placeholder="国内填写"></div>
            <div class="form-group"><label>毕业留言</label><textarea id="editMessage" rows="3"></textarea></div>
            <button class="save-btn" id="saveSelfBtn" onclick="saveSelfInfo()">保存修改</button>
            <button class="cancel-btn" onclick="showChangePwdModal()">修改密码</button>
        </div>

        <div id="adminPanel" style="display:none;">
            <button class="add-user-btn" onclick="showAddModal()">+ 新增用户</button>
            <div class="user-list" id="userList"></div>
        </div>
    </div>
</div>

<!-- 弹窗与原代码相同，此处省略以节省篇幅，请保留原全部弹窗 HTML -->
<!-- 请将原代码中所有模态框复制过来，如 adminEditModal、changePwdModal、studentDetailModal 等，此处为简洁未列出 -->

<script>
const API_BASE = '/api';
let currentUser = JSON.parse(localStorage.getItem('currentUser'));
let mapChart = null, mapLevel = 'world', currentGeoJson = null, currentProvinceName = '', currentCityName = '';
let allPoints = [], worldMapLoaded = false, adminUserList = [];
let currentDetailStudent = null, replyParentId = null;
let loadMapLock = '', locateTimer = null, searchTimer = null, highlightTimer = null;
const mapCache = {};

// …… 保留原有的所有坐标映射、shortName、formatPoints 等函数（不变）……
// …… 保留原有的 toggleLike、renderClassmatesList、openStudentDetail、评论相关等函数（不变）……

// 修改 loadMapJson：从代理接口获取 GeoJSON
function loadMapJson(adcode, mapName) {
    if (mapCache[adcode]) return Promise.resolve(mapCache[adcode]);
    return fetch(`/api/geojson/${adcode}`)
        .then(res => { if (!res.ok) throw new Error('地图数据加载失败'); return res.json(); })
        .then(geoJson => {
            mapCache[adcode] = geoJson;
            echarts.registerMap(mapName, geoJson);
            return geoJson;
        });
}

// …… 保留原有的 initWorldMap、renderWorldMap、bindWorldClick、loadChinaMap 等函数（不变）……
// …… 保留原有的 goBack、getAdcodeByName 等函数（不变）……

// 新增：地址搜索并定位
function searchAndLocate() {
    const q = document.getElementById('locSearchInput').value.trim();
    if (!q) { alert('请输入地址'); return; }
    fetch(`/api/geocode?q=${encodeURIComponent(q)}`)
        .then(res => res.json())
        .then(data => {
            if (Array.isArray(data) && data.length > 0) {
                const loc = data[0];
                const lat = parseFloat(loc.lat);
                const lon = parseFloat(loc.lon);
                locateByCoord(lat, lon);
            } else {
                alert('未找到该地址，请尝试更详细的地址');
            }
        })
        .catch(() => alert('搜索失败，请稍后再试'));
}

// 根据经纬度定位到地图上并高亮最近的同学散点
function locateByCoord(lat, lng) {
    if (!mapChart) return;
    // 判断是否在中国境内（粗略判断）
    const isChina = (lat > 18 && lat < 54 && lng > 73 && lng < 135);
    if (isChina && allPoints.some(p => p.country === '中国')) {
        // 先加载中国地图，然后移动中心并缩放
        loadChinaMap();
        setTimeout(() => {
            mapChart.setOption({ geo: { center: [lng, lat], zoom: 3 } });
            // 高亮最近的点
            highlightNearestPoint(lat, lng);
        }, 600);
    } else {
        renderWorldMap();
        bindWorldClick();
        setTimeout(() => {
            mapChart.setOption({ geo: { center: [lng, lat], zoom: 2.5 } });
            highlightNearestPoint(lat, lng);
        }, 300);
    }
}

function highlightNearestPoint(lat, lng) {
    if (!allPoints.length) return;
    // 从预置坐标中找出最近的城市名
    let minDist = Infinity, nearestName = '';
    for (let city in cityCoords) {
        const [clng, clat] = cityCoords[city];
        const dist = Math.sqrt((clng-lng)**2 + (clat-lat)**2);
        if (dist < minDist) { minDist = dist; nearestName = city; }
    }
    // 再尝试区县、省份
    for (let dist in districtCoords) {
        const [dlng, dlat] = districtCoords[dist];
        const distVal = Math.sqrt((dlng-lng)**2 + (dlat-lat)**2);
        if (distVal < minDist) { minDist = distVal; nearestName = dist; }
    }
    if (nearestName) {
        setTimeout(() => highlightPoint(nearestName), 200);
    }
}

// 绑定回车搜索
document.getElementById('locSearchInput')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') searchAndLocate();
});

// 保留原有的 window.onload 逻辑，但需将 MAP_BASE 移除，其他不变
window.onload = function() {
    if (!currentUser) { window.location.href = '/'; return; }
    const roleText = { 'admin':'管理员','user':'成员','teacher':'老师' }[currentUser.role] || '成员';
    document.getElementById('currentUserName').textContent = currentUser.name + '（' + roleText + '）';
    if (currentUser.role === 'admin') document.getElementById('adminTab').style.display = 'block';
    mapChart = echarts.init(document.getElementById('map'));
    window.addEventListener('resize', () => mapChart.resize());
    document.addEventListener('keydown', e => { if (e.key === 'Escape') goBack(); });
    loadMapPoints();
    loadSelfInfo();
    initWorldMap();
    // 定位框回车
    document.getElementById('locSearchInput').addEventListener('keydown', e => { if(e.key==='Enter') searchAndLocate(); });
};
</script>
