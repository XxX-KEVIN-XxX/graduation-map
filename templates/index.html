<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>毕业地图 · 在地球上见</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js">
    </script>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f5f0ea;
            --bg-card: rgba(255, 253, 250, 0.75);
            --bg-card-solid: #fffdfa;
            --bg-input: #f8f5f0;
            --bg-hover: #eee8e0;
            --border-light: rgba(210, 200, 188, 0.4);
            --border-medium: #d2c8bc;
            --text-primary: #2c2520;
            --text-secondary: #6b5f52;
            --text-muted: #9a8b7a;
            --accent-blue: #4d8f9e;
            --accent-red: #c45a4a;
            --accent-gold: #b8a08a;
            --shadow-sm: 0 2px 10px rgba(44, 37, 32, 0.06);
            --shadow-md: 0 6px 30px rgba(44, 37, 32, 0.08);
            --shadow-lg: 0 12px 50px rgba(44, 37, 32, 0.14);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-serif: "Georgia", "Noto Serif SC", "Songti SC", serif;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg-primary);
            background-image: radial-gradient(circle at 20% 30%, rgba(210, 200, 188, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(180, 170, 158, 0.10) 0%, transparent 50%);
            font-family: var(--font-sans);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 20px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ===== Header ===== */
        .header {
            height: 76px;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 253, 250, 0.70);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            border-bottom: 1px solid rgba(210, 200, 188, 0.25);
            position: relative;
            z-index: 20;
            flex-shrink: 0;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(210, 200, 188, 0.4), transparent);
        }

        .header-left h2 {
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-primary);
        }

        .header-left h2 span {
            color: var(--accent-red);
            font-weight: 700;
        }

        .header-left p {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 2px;
            font-weight: 400;
            margin-top: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
        }

        .user-info {
            color: var(--text-secondary);
            font-weight: 450;
            padding: 5px 16px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 30px;
            font-size: 13px;
            border: 1px solid rgba(210, 200, 188, 0.2);
        }

        .logout-btn {
            padding: 6px 20px;
            border: 1px solid rgba(210, 200, 188, 0.4);
            border-radius: 30px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 450;
            transition: all var(--transition);
            backdrop-filter: blur(4px);
        }

        .logout-btn:hover {
            background: var(--text-primary);
            color: #fff;
            border-color: var(--text-primary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        /* ===== Main ===== */
        .main {
            display: flex;
            height: calc(100vh - 76px);
            gap: 0;
            background: transparent;
        }

        /* ===== Map ===== */
        .map-container {
            flex: 1;
            position: relative;
            min-width: 0;
            background: transparent;
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 0;
        }

        /* 地图工具提示全局覆盖（通过echarts配置已优化，额外样式） */
        .map-back-btn {
            position: absolute;
            top: 20px;
            left: 24px;
            padding: 8px 20px;
            background: rgba(255, 253, 250, 0.80);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(210, 200, 188, 0.3);
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-secondary);
            display: none;
            font-family: var(--font-sans);
            box-shadow: var(--shadow-sm);
            z-index: 10;
            transition: all var(--transition);
            font-weight: 450;
            letter-spacing: 0.3px;
        }

        .map-back-btn:hover {
            background: #ffffff;
            border-color: var(--border-medium);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .map-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-secondary);
            font-size: 13px;
            z-index: 9;
            background: rgba(255, 253, 250, 0.90);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 18px 36px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(210, 200, 188, 0.2);
            display: none;
            text-align: center;
            line-height: 1.8;
            box-shadow: var(--shadow-lg);
            min-width: 170px;
        }

        .map-loading button {
            margin-top: 10px;
            padding: 5px 18px;
            border: 1px solid var(--border-medium);
            background: #fff;
            border-radius: 30px;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 12px;
            transition: all var(--transition);
        }

        .map-loading button:hover {
            background: var(--text-primary);
            color: #fff;
            border-color: var(--text-primary);
        }

        .map-stats {
            position: absolute;
            bottom: 32px;
            left: 32px;
            z-index: 5;
            pointer-events: none;
        }

        .map-stats .en {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 400;
            opacity: 0.7;
        }

        .map-stats .cn {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 3px;
            font-family: var(--font-serif);
            color: var(--text-primary);
            text-shadow: 0 2px 8px rgba(255, 253, 250, 0.3);
        }

        .map-stats .count {
            font-size: 20px;
            color: var(--accent-red);
            font-weight: 700;
            margin-left: 4px;
            font-family: var(--font-sans);
        }

        /* ===== Sidebar ===== */
        .sidebar {
            width: 370px;
            background: rgba(255, 253, 250, 0.60);
            backdrop-filter: blur(20px) saturate(1.3);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            border-left: 1px solid rgba(210, 200, 188, 0.2);
            padding: 24px 22px;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        /* ===== Tab Bar ===== */
        .tab-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 22px;
            padding: 4px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border-radius: var(--radius-md);
            flex-shrink: 0;
            border: 1px solid rgba(210, 200, 188, 0.15);
        }

        .tab-item {
            flex: 1;
            text-align: center;
            padding: 9px 0;
            font-size: 13px;
            cursor: pointer;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            transition: all var(--transition);
            user-select: none;
            font-weight: 450;
            letter-spacing: 0.5px;
        }

        .tab-item:hover {
            color: var(--text-secondary);
        }

        .tab-item.active {
            background: #ffffff;
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            font-weight: 500;
        }

        .admin-tab {
            display: none;
        }

        /* ===== Search ===== */
        .search-box {
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid rgba(210, 200, 188, 0.25);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            font-family: var(--font-sans);
            transition: all var(--transition);
        }

        .search-box input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(77, 143, 158, 0.12);
            background: #ffffff;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ===== Classmates List ===== */
        .classmates-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .classmates-list .empty {
            text-align: center;
            color: var(--text-muted);
            padding: 48px 0;
            font-size: 13px;
        }

        .classmate-item {
            padding: 14px 18px;
            border: 1px solid rgba(210, 200, 188, 0.15);
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.50);
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
        }

        .classmate-item:hover {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(210, 200, 188, 0.4);
            transform: translateX(4px) translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .classmate-item:active {
            transform: scale(0.98);
        }

        .classmate-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
            font-family: var(--font-serif);
        }

        .classmate-loc {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .classmate-msg {
            font-size: 12.5px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .classmate-msg .msg-hide-tip {
            color: var(--text-muted);
            font-style: italic;
        }

        .like-area {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .like-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-muted);
            padding: 0;
            line-height: 1;
            transition: all 0.2s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .like-btn:hover {
            transform: scale(1.25);
        }

        .like-btn.liked {
            color: var(--accent-red);
            animation: likePop 0.35s ease;
        }

        @keyframes likePop {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.5);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }

        .like-count,
        .comment-count {
            user-select: none;
            font-weight: 450;
        }

        .comment-count {
            margin-left: 4px;
            color: var(--text-muted);
        }

        /* ===== Self Panel ===== */
        #selfPanel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-right: 4px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 9px 14px;
            border: 1px solid rgba(210, 200, 188, 0.25);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            font-family: var(--font-sans);
            transition: all var(--transition);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(77, 143, 158, 0.10);
            background: #ffffff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
            line-height: 1.6;
        }

        .form-group select {
            appearance: auto;
            cursor: pointer;
        }

        .save-btn {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, var(--text-primary), #3d322b);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1.5px;
            font-family: var(--font-sans);
            margin-top: 4px;
            transition: all var(--transition);
            box-shadow: 0 2px 8px rgba(44, 37, 32, 0.15);
        }

        .save-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(44, 37, 32, 0.20);
        }

        .save-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .cancel-btn {
            width: 100%;
            padding: 11px;
            background: rgba(255, 255, 255, 0.3);
            color: var(--text-secondary);
            border: 1px solid rgba(210, 200, 188, 0.3);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 450;
            letter-spacing: 1px;
            font-family: var(--font-sans);
            margin-top: 6px;
            transition: all var(--transition);
            backdrop-filter: blur(4px);
        }

        .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.6);
            border-color: var(--text-muted);
        }

        /* ===== Admin ===== */
        #adminPanel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-right: 4px;
        }

        .add-user-btn {
            width: 100%;
            padding: 11px;
            border: 1.5px dashed rgba(210, 200, 188, 0.4);
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 450;
            margin-bottom: 16px;
            transition: all var(--transition);
            letter-spacing: 0.5px;
            flex-shrink: 0;
            backdrop-filter: blur(4px);
        }

        .add-user-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            border-style: solid;
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            padding: 12px 16px;
            border: 1px solid rgba(210, 200, 188, 0.15);
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.40);
            backdrop-filter: blur(4px);
            transition: all var(--transition);
        }

        .user-item:hover {
            border-color: rgba(210, 200, 188, 0.3);
            box-shadow: var(--shadow-sm);
            background: rgba(255, 255, 255, 0.7);
        }

        .user-item .name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .user-item .name {
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font-serif);
        }

        .user-item .role {
            font-size: 11px;
            padding: 2px 12px;
            border-radius: 20px;
            background: rgba(210, 200, 188, 0.2);
            color: var(--text-secondary);
            font-weight: 450;
        }

        .user-item .loc {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .user-item .ops {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .user-item .ops button {
            flex: 1;
            min-width: 44px;
            padding: 5px 0;
            font-size: 12px;
            border: 1px solid rgba(210, 200, 188, 0.2);
            background: rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            font-family: var(--font-sans);
            transition: all var(--transition);
            font-weight: 450;
            backdrop-filter: blur(4px);
        }

        .user-item .ops button:hover {
            background: rgba(255, 255, 255, 0.6);
            border-color: var(--border-medium);
        }

        .user-item .ops button:last-child:hover {
            background: rgba(196, 90, 74, 0.10);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        /* ===== Modal ===== */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 37, 32, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            z-index: 9999;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        @keyframes slideUpElastic {
            0% {
                opacity: 0;
                transform: translate(-50%, -45%) scale(0.94);
            }
            60% {
                transform: translate(-50%, -52%) scale(1.01);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 253, 250, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px 34px;
            border-radius: var(--radius-lg);
            width: 440px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            z-index: 10000;
            animation: slideUpElastic 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .modal-title {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
            text-align: center;
            letter-spacing: 2px;
            font-family: var(--font-serif);
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .modal-btns button {
            flex: 1;
        }

        .form-tip {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 3px;
            font-weight: 400;
        }

        /* ===== Detail Modal ===== */
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .detail-name {
            font-size: 20px;
            font-weight: 600;
            font-family: var(--font-serif);
        }

        .detail-loc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        .detail-msg {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            padding: 16px 18px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            line-height: 1.7;
            font-size: 14px;
            border: 1px solid rgba(210, 200, 188, 0.15);
            color: var(--text-secondary);
        }

        .detail-msg .like-area {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(210, 200, 188, 0.2);
        }

        .comment-list {
            margin-top: 12px;
            max-height: 260px;
            overflow-y: auto;
            border-top: 1px solid rgba(210, 200, 188, 0.15);
            padding-top: 12px;
        }

        .comment-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(210, 200, 188, 0.1);
        }

        .comment-item:last-child {
            border-bottom: none;
        }

        .comment-author {
            font-weight: 500;
            font-size: 13px;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-primary);
        }

        .comment-author .comment-time {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .comment-content {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .comment-delete {
            font-size: 11px;
            color: var(--accent-red);
            cursor: pointer;
            background: none;
            border: none;
            font-family: var(--font-sans);
            padding: 0 6px;

        <div class="header-left">

        </div>
        <div class="header-right">
            <span class="user-info" id="currentUserName"></span>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </div>

    <div class="main">
        <div class="map-container">
            <button class="map-back-btn" id="backBtn" onclick="goBack()">← 返回</button>

            <div id="map"></div>
            <div class="map-stats">

        </div>

        <div class="sidebar">
            <div class="tab-bar">
                <div class="tab-item active" onclick="switchTab('classmates')">同学列表</div>

                <div class="tab-item admin-tab" id="adminTab" onclick="switchTab('admin')">用户管理</div>
            </div>

            <div id="classmatesPanel" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索同学姓名…" oninput="filterClassmates(this.value)">
                </div>
                <div class="classmates-list" id="classmatesList"></div>
            </div>

            <div id="selfPanel" style="display:none; flex:1; overflow-y:auto; padding-right:4px;">
                <div class="form-group"><label>姓名 <span style="color:var(--accent-red);">*</span></label><input type="text" id="editName"></div>
                <div class="form-group"><label>国家 <span style="color:var(--accent-red);">*</span></label><input type="text" id="editCountry"></div>

                <div class="form-group"><label>城市</label><input type="text" id="editCity"></div>
                <div class="form-group"><label>区县</label><input type="text" id="editDistrict" placeholder="国内填写"></div>
                <div class="form-group"><label>毕业留言</label><textarea id="editMessage" rows="3"></textarea></div>

                <button class="cancel-btn" onclick="showChangePwdModal()">修改密码</button>

            </div>

            '印度': [78.9629, 20.5937],

        function shortName(name) { if (!name) return ''; return name.trim().replace(/省|市|区|县|自治区|特别行政区|壮族|回族|维吾尔/g, ''); }

        function request(url, options = {}) {
            return fetch(url, { headers: { 'Content-Type': 'application/json', ...options.headers }, ...options })
                .then(res => res.json())
                .catch(err => { console.error('请求失败:', err); alert('网络请求失败，请检查服务状态'); throw err; });
        }

        function toggleLike(toUsername, btnElement) {
            if (btnElement.disabled) return;
            btnElement.disabled = true;
            request(`${API_BASE}/like/${encodeURIComponent(toUsername)}?from_username=${encodeURIComponent(currentUser.username)}`, { method: 'POST' })
                .then(res => {
                    btnElement.disabled = false;
                    if (res.code === 200) {
                        const { liked, like_count } = res.data;
                        btnElement.innerHTML = liked ? '❤️' : '🤍';
                        btnElement.className = `like-btn ${liked ? 'liked' : ''}`;
                        btnElement.title = liked ? '取消点赞' : '点赞';
                        const countSpan = btnElement.parentElement.querySelector('.like-count');
                        if (countSpan) countSpan.textContent = like_count;
                        const student = allPoints.find(p => p.username === toUsername);
                        if (student) { student.is_liked = liked;
                            student.like_count = like_count; }
                        if (currentDetailStudent && currentDetailStudent.username === toUsername) refreshDetailLikeArea();
                    } else if (res.code === 403) {
                        alert(res.msg || '操作被禁止');
                    } else {
                        alert(res.msg || '操作失败');
                    }
                })
                .catch(() => { btnElement.disabled = false; });
        }

        function getSymbolSize(val, params) {
            if (mapLevel === 'world') return 10;
            if (mapLevel === 'country') return 14;
            if (mapLevel === 'province') {
                const cityName = shortName(params.data?.city);
                if (!cityName) return 10;
                const count = allPoints.filter(p => shortName(p.city) === cityName).length;
                return 8 + count * 3;
            }
            if (mapLevel === 'city') {
                const districtName = shortName(params.data?.district);
                if (!districtName) return 10;
                const count = allPoints.filter(p => shortName(p.district) === districtName).length;
                return 8 + count * 3;
            }
            return 10;
        }

        function formatWorldPoints() {
            const cityMap = {};
            allPoints.forEach(p => {
                const cityName = p.city || p.province || '未知';
                const cityShort = shortName(cityName);
                if (!cityMap[cityShort]) {
                    let coord = cityCoords[cityShort] || cityCoords[shortName(p.province)] || [0, 0];
                    if ((coord[0] === 0 && coord[1] === 0) && p.country && countryCoords[p.country]) {
                        coord = countryCoords[p.country];
                    }
                    if (coord[0] === 0 && coord[1] === 0) return;
                    cityMap[cityShort] = { name: cityName, value: coord };
                }
            });
            return Object.values(cityMap);
        }

        function formatProvincePoints() {
            const provinceMap = {};
            allPoints.forEach(p => {
                if (p.country === '中国' && p.province) {
                    const provShort = shortName(p.province);
                    if (!provinceMap[provShort]) provinceMap[provShort] = { name: p.province, value: provinceCoords[
                            provShort] || [104, 35] };
                }
            });
            return Object.values(provinceMap);
        }

        function formatCityPoints() {
            const cityMap = {};
            const targetShort = shortName(currentProvinceName);
            allPoints.forEach(p => {
                if (!p.city) return;
                const provShort = shortName(p.province || '');
                if (currentProvinceName && provShort !== targetShort) return;
                const cityName = p.city.trim();
                const cityShort = shortName(cityName);
                if (!cityMap[cityShort]) {
                    let coord = cityCoords[cityShort] || provinceCoords[targetShort] || [120.15, 30.27];
                    if (coord[0] === 0 && coord[1] === 0) return;
                    cityMap[cityShort] = { name: cityName, value: coord, city: cityName };
                }
            });
            return Object.values(cityMap);
        }

        function formatDistrictPoints() {
            const districtMap = {};
            const targetShort = shortName(currentCityName);
            allPoints.forEach(p => {
                if (!p.district || p.district.trim() === '') return;
                const cityShort = shortName(p.city || '');
                if (currentCityName && cityShort !== targetShort) return;
                const districtName = p.district.trim();
                const districtShort = shortName(districtName);
                if (!districtMap[districtShort]) {
                    let coord = districtCoords[districtShort] || cityCoords[targetShort] || [120.15, 30.27];
                    if (coord[0] === 0 && coord[1] === 0) return;
                    districtMap[districtShort] = { name: districtName, value: coord, district: districtName };
                }
            });
            return Object.values(districtMap);
        }

        function getPointTooltip(name, level) {
            let list = [];
            if (level === 'world') list = allPoints.filter(p => shortName(p.city || p.province) === shortName(name));
            else if (level === 'country') list = allPoints.filter(p => shortName(p.province) === shortName(name));
            else if (level === 'province') list = allPoints.filter(p => shortName(p.city) === shortName(name));
            else if (level === 'city') list = allPoints.filter(p => shortName(p.district) === shortName(name));
            const names = list.map(p => p.name).join('、');
            return `${name}<br/>共 ${list.length} 位同学<br/><span style="font-size:12px;color:#9a8b7a;">${names || '暂无'}</span>`;
        }

        function appendLikeCountToTooltip(baseStr, level, name) {
            if (currentUser.role === 'teacher') return baseStr;
            let students = [];
            if (level === 'world') students = allPoints.filter(p => shortName(p.city || p.province) === shortName(name));
            else if (level === 'country') students = allPoints.filter(p => shortName(p.province) === shortName(name));
            else if (level === 'province') students = allPoints.filter(p => shortName(p.city) === shortName(name));
            else if (level === 'city') students = allPoints.filter(p => shortName(p.district) === shortName(name));
            const totalLikes = students.reduce((sum, s) => sum + (s.like_count || 0), 0);
            if (totalLikes > 0) baseStr += `<br/>❤️ ${totalLikes} 赞`;
            return baseStr;
        }

        function renderClassmatesList(keyword = '') {
            const container = document.getElementById('classmatesList');
            let list = [];
            const kw = keyword.trim().toLowerCase();
            const isTeacher = currentUser.role === 'teacher';

            allPoints.forEach((p, i) => {
                if (kw && !p.name.toLowerCase().includes(kw)) return;
                list.push({ ...p, index: i });
            });
            list.sort((a, b) => (b.like_count || 0) - (a.like_count || 0));

            if (list.length === 0) {
                container.innerHTML = '<div class="empty">未找到匹配的同学</div>';
                return;
            }

            container.innerHTML = list.map(u => `
                <div class="classmate-item" data-index="${u.index}" onclick="openStudentDetail('${u.username}')">
                    <div class="classmate-name">${u.name}</div>
                    <div class="classmate-loc">${u.country} ${u.province||''} ${u.city||''} ${u.district||''}</div>
                    <div class="classmate-msg">
                        ${isTeacher ? '<span class="msg-hide-tip">暂无留言</span>' : (u.message||'暂无留言')}
                    </div>
                    ${!isTeacher ? `
                    <div class="like-area" onclick="event.stopPropagation();">
                        <button class="like-btn ${u.is_liked ? 'liked' : ''}" onclick="toggleLike('${u.username}', this)" title="${u.is_liked ? '取消点赞' : '点赞'}">
                            ${u.is_liked ? '❤️' : '🤍'}
                        </button>
                        <span class="like-count">${u.like_count||0}</span>
                        <span class="comment-count">💬 ${u.comment_count||0}</span>
                    </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function filterClassmates(keyword) { if (searchTimer) clearTimeout(searchTimer);
            searchTimer = setTimeout(() => renderClassmatesList(keyword), 300); }

        function openStudentDetail(username) {
            const student = allPoints.find(p => p.username === username);
            if (!student) return;
            currentDetailStudent = student;
            locateStudent(student);
            document.getElementById('detailStudentName').textContent = student.name;
            document.getElementById('detailStudentLoc').textContent =
            `${student.country} ${student.province||''} ${student.city||''} ${student.district||''}`;
            const isTeacher = currentUser.role === 'teacher';
            document.getElementById('detailMessageArea').style.display = isTeacher ? 'none' : 'block';
            document.getElementById('detailCommentSection').style.display = isTeacher ? 'none' : 'block';
            document.getElementById('detailTeacherTip').style.display = isTeacher ? 'block' : 'none';
            if (!isTeacher) {
                document.getElementById('detailMessageContent').textContent = student.message || '暂无留言';
                refreshDetailLikeArea();
                loadComments(username);
            }
            document.getElementById('studentDetailModal').style.display = 'block';
        }

        function refreshDetailLikeArea() {
            if (!currentDetailStudent) return;
            const s = currentDetailStudent;
            const container = document.getElementById('detailLikeArea');
            container.innerHTML =
                `<button class="like-btn ${s.is_liked ? 'liked' : ''}" onclick="toggleLike('${s.username}', this)" title="${s.is_liked ? '取消点赞' : '点赞'}">${s.is_liked ? '❤️' : '🤍'}</button><span class="like-count">${s.like_count||0}</span>`;
        }

        function closeStudentDetail() {
            document.getElementById('studentDetailModal').style.display = 'none';
            currentDetailStudent = null;
            document.getElementById('commentInput').value = '';
            document.getElementById('replyParentId').value = '';
            replyParentId = null;
        }

        function loadComments(toUsername) {
            request(`${API_BASE}/comment/${encodeURIComponent(toUsername)}`)
                .then(res => {
                    if (res.code === 200) renderComments(res.data);
                    else document.getElementById('commentListContainer').innerHTML =
                        '<div style="color:var(--text-muted);text-align:center;padding:12px 0;">加载评论失败</div>';
                });
        }

        function renderComments(comments) {
            const container = document.getElementById('commentListContainer');
            if (!comments || comments.length === 0) {
                container.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:12px 0;">暂无评论，快来写第一条吧</div>';
                return;
            }
            let html = '';
            comments.forEach(c => { html += buildCommentItem(c); });
            container.innerHTML = html;
        }

        function buildCommentItem(comment) {
            const canDelete = (comment.from_username === currentUser.username) || (currentUser.role === 'admin');
            let html =
                `<div class="comment-item"><div class="comment-author"><span>${comment.from_name || comment.from_username}</span><span class="comment-time">${comment.created_at}</span></div><div class="comment-content">${comment.content}</div><div style="margin-top:4px;"><button class="comment-reply-btn" onclick="setReplyParent(${comment.id})">回复</button>${canDelete ? `<button class="comment-delete" onclick="deleteComment(${comment.id})">删除</button>` : ''}</div></div>`;
            if (comment.replies && comment.replies.length > 0) {
                html += '<div class="reply-item">';
                comment.replies.forEach(reply => { html += buildCommentItem(reply); });
                html += '</div>';
            }
            return html;
        }

        function setReplyParent(commentId) {
            replyParentId = commentId;
            document.getElementById('replyParentId').value = commentId;
            document.getElementById('commentInput').placeholder = '写下你的回复…';
            document.getElementById('commentInput').focus();
        }

        function submitComment() {
            const input = document.getElementById('commentInput');
            const btn = document.getElementById('commentSubmitBtn');
            const content = input.value.trim();
            if (!content) return;
            if (!currentDetailStudent) return;
            const body = { content: content, parent_id: replyParentId ? parseInt(replyParentId) : null };
            btn.disabled = true;
            request(`${API_BASE}/comment/${encodeURIComponent(currentDetailStudent.username)}?from_username=${encodeURIComponent(currentUser.username)}`, {
                    method: 'POST',
                    body: JSON.stringify(body)
                })
                .then(res => {
                    btn.disabled = false;
                    if (res.code === 200) {
                        input.value = '';
                        document.getElementById('replyParentId').value = '';
                        replyParentId = null;
                        input.placeholder = '写下你的评论…';
                        loadComments(currentDetailStudent.username);
                    } else {
                        alert(res.msg || '评论失败');
                    }
                })
                .catch(() => { btn.disabled = false; });
        }

        function deleteComment(commentId) {
            if (!confirm('确定删除这条评论吗？')) return;
            request(`${API_BASE}/comment/${commentId}?username=${encodeURIComponent(currentUser.username)}`, { method: 'DELETE' })
                .then(res => {
                    if (res.code === 200) { if (currentDetailStudent) loadComments(currentDetailStudent.username); } else alert(res
                        .msg || '删除失败');
                });
        }

        function locateStudent(student) {
            if (locateTimer) clearTimeout(locateTimer);
            if (highlightTimer) clearTimeout(highlightTimer);
            const country = student.country || '';
            const province = student.province || '';
            const city = student.city || '';
            const district = student.district || '';
            let coord = null,
                highlightName = '';
            if (district && districtCoords[shortName(district)]) {
                coord = districtCoords[shortName(district)];
                highlightName = district;
            } else if (city && cityCoords[shortName(city)]) {
                coord = cityCoords[shortName(city)];
                highlightName = city;
            } else if (province && provinceCoords[shortName(province)]) {
                coord = provinceCoords[shortName(province)];
                highlightName = province;
            } else if (country && countryCoords[country]) {
                coord = countryCoords[country];
                highlightName = country;
            } else {
                alert('该同学位置信息不完整，无法定位');
                return;
            }

            if (country !== '中国') {
                renderWorldMap();
                bindWorldClick();
                locateTimer = setTimeout(() => { mapChart.setOption({ geo: { center: coord, zoom: 3 } });
                    highlightPoint(shortName(highlightName)); }, 200);
                return;
            }

            if (!province) {
                loadChinaMap();
                locateTimer = setTimeout(() => { mapChart.setOption({ geo: { center: coord, zoom: 2 } });
                    highlightPoint(shortName(highlightName)); }, 500);
                return;
            }

            let provAdcode = null;
            for (let fullName in provinceAdcodeMap) {
                if (shortName(fullName) === shortName(province)) { provAdcode = provinceAdcodeMap[fullName]; break; }
            }
            if (!provAdcode) {
                loadChinaMap();
                locateTimer = setTimeout(() => { mapChart.setOption({ geo: { center: coord, zoom: 2 } });
                    highlightPoint(shortName(highlightName)); }, 500);
                return;
            }
            if (!city) {
                loadProvinceMap(provAdcode, province);
                locateTimer = setTimeout(() => { mapChart.setOption({ geo: { center: coord, zoom: 1.6 } });
                    highlightPoint(shortName(highlightName)); }, 500);
                return;
            }
            if (!district) {
                loadProvinceMap(provAdcode, province);
                locateTimer = setTimeout(() => { mapChart.setOption({ geo: { center: coord, zoom: 2.2 } });
                    highlightPoint(shortName(highlightName)); }, 500);
                return;
            }
            loadProvinceMap(provAdcode, province);
            locateTimer = setTimeout(() => {
                const cityAdcode = getAdcodeByName(currentGeoJson, city);
                if (cityAdcode) {
                    loadCityMap(cityAdcode, city);
                    locateTimer = setTimeout(() => { mapChart.setOption({ geo: { center: coord, zoom: 2.5 } });
                        highlightPoint(shortName(highlightName)); }, 500);
                } else {
                    mapChart.setOption({ geo: { center: coord, zoom: 2.2 } });
                    highlightPoint(shortName(highlightName));
                }
            }, 500);
        }

        function highlightPoint(name) {
            if (!name || !mapChart) return;
            mapChart.dispatchAction({ type: 'highlight', seriesIndex: 0, name: name });
            highlightTimer = setTimeout(() => { mapChart.dispatchAction({ type: 'downplay', seriesIndex: 0, name: name }); },
            2000);
        }

        function loadMapJson(adcode, mapName) {
            const cacheKey = adcode;
            if (mapCache[cacheKey]) return Promise.resolve(mapCache[cacheKey]);
            return fetch(`${MAP_BASE}/${adcode}_full.json`)
                .then(res => { if (!res.ok) throw new Error('地图文件不存在'); return res.json(); })
                .then(geoJson => { mapCache[cacheKey] = geoJson;
                    echarts.registerMap(mapName, geoJson); return geoJson; });
        }

        function initWorldMap() {
            showLoading();
            const lockKey = 'world';
            loadMapLock = lockKey;
            if (mapCache['world']) { worldMapLoaded = true;
                hideLoading();
                renderWorldMap();
                bindWorldClick(); return; }
            fetch(`${MAP_BASE}/world.json`)
                .then(res => { if (!res.ok) throw new Error('世界地图文件不存在'); return res.json(); })
                .then(worldJson => {
                    if (loadMapLock !== lockKey) return;
                    mapCache['world'] = worldJson;
                    echarts.registerMap('world', worldJson);
                    worldMapLoaded = true;
                    hideLoading();
                    renderWorldMap();
                    bindWorldClick();
                })
                .catch(() => {
                    if (loadMapLock !== lockKey) return;
                    document.getElementById('mapLoading').innerHTML =
                        '世界地图加载失败，请检查地图文件是否存在<br/><button onclick="initWorldMap()">重试</button>';
                });
        }

        function loadProvinceMap(adcode, name) {

                .then(geoJson => {

                        borderColor: '#d5cbbc',
                        borderWidth: 0.5,
                        shadowBlur: 6,
                        shadowColor: 'rgba(44,37,32,0.04)'
                    },
                    emphasis: {
                        itemStyle: { areaColor: '#d5cbbc' },
                        label: { show: true, color: '#2c2520', fontSize: 11, fontWeight: 500 }
                    }
                },
                series: [{
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    symbolSize: getSymbolSize,
                    itemStyle: {
                        color: '#4d8f9e',
                        shadowBlur: 12,
                        shadowColor: 'rgba(77,143,158,0.30)',
                        opacity: 0.9,
                        borderColor: '#fff',
                        borderWidth: 1
                    },
                    emphasis: {
                        itemStyle: {
                            color: '#c45a4a',
                            shadowBlur: 16,
                            shadowColor: 'rgba(196,90,74,0.45)',
                            opacity: 1
                        }
                    },
                    data: formatCityPoints()
                }]
            };
            mapChart.setOption(option, true);
        }

        function bindCityClick(geoJson) {
            mapChart.off('click');
            mapChart.on('click', params => {
                if (params.componentType === 'geo') {
                    const cityCode = getAdcodeByName(geoJson, params.name);
                    if (cityCode) loadCityMap(cityCode, params.name);
                }
            });
        }

        function loadCityMap(adcode, name) {
            currentCityName = name || '';
            showLoading();
            const lockKey = `city_${adcode}`;
            loadMapLock = lockKey;
            loadMapJson(adcode, 'city')
                .then(geoJson => {
                    if (loadMapLock !== lockKey) return;
                    currentGeoJson = geoJson;
                    hideLoading();
                    renderCityMap();
                })
                .catch(() => { if (loadMapLock !== lockKey) return;
                    hideLoading();
                    alert('市级地图加载失败'); });
        }

        function renderCityMap() {
            mapLevel = 'city';
            document.getElementById('backBtn').style.display = 'block';
            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    show: true,
                    backgroundColor: 'rgba(255,253,250,0.92)',
                    borderColor: 'rgba(210,200,188,0.2)',
                    borderWidth: 1,
                    borderRadius: 10,
                    padding: [12, 16],
                    textStyle: { color: '#2c2520', fontSize: 12 },
                    formatter: function(params) {
                        if (params.componentType === 'geo') return params.name;
                        let base = getPointTooltip(params.name, 'city');
                        return appendLikeCountToTooltip(base, 'city', params.name);
                    }
                },
                geo: {
                    map: 'city',
                    roam: true,
                    zoom: 1.2,
                    itemStyle: {
                        areaColor: '#e5ddd4',
                        borderColor: '#d5cbbc',
                        borderWidth: 0.5,
                        shadowBlur: 6,
                        shadowColor: 'rgba(44,37,32,0.04)'
                    },
                    emphasis: {
                        itemStyle: { areaColor: '#d5cbbc' },
                        label: { show: true, color: '#2c2520', fontSize: 11, fontWeight: 500 }
                    }
                },
                series: [{
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    symbolSize: getSymbolSize,
                    itemStyle: {
                        color: '#4d8f9e',
                        shadowBlur: 12,
                        shadowColor: 'rgba(77,143,158,0.30)',
                        opacity: 0.9,
                        borderColor: '#fff',
                        borderWidth: 1
                    },
                    emphasis: {
                        itemStyle: {
                            color: '#c45a4a',
                            shadowBlur: 16,
                            shadowColor: 'rgba(196,90,74,0.45)',
                            opacity: 1
                        }
                    },
                    data: formatDistrictPoints()
                }]
            };
            mapChart.setOption(option, true);
        }

        function goBack() {
            if (locateTimer) clearTimeout(locateTimer);
            if (highlightTimer) clearTimeout(highlightTimer);
            if (mapLevel === 'city') {
                currentCityName = '';
                if (!currentGeoJson || !currentGeoJson.features || currentGeoJson.features.length === 0) { loadChinaMap(); return; }
                const cityCode = currentGeoJson.features[0].properties.adcode;
                const provCode = String(cityCode).slice(0, 2) + '0000';
                loadProvinceMap(provCode, currentProvinceName);
            } else if (mapLevel === 'province') { currentProvinceName = '';
                loadChinaMap(); } else if (mapLevel === 'country') { renderWorldMap();
                bindWorldClick(); }
        }

        function getAdcodeByName(geoJson, name) {
            const targetShort = shortName(name);
            for (let feat of geoJson.features) { if (shortName(feat.properties.name) === targetShort) return feat.properties
                    .adcode; }
            return null;
        }

        function showLoading() { document.getElementById('mapLoading').style.display = 'block';
            document.getElementById('mapLoading').innerHTML = '地图加载中…'; }

        function hideLoading() { document.getElementById('mapLoading').style.display = 'none'; }

        function loadMapPoints() {
            request(`${API_BASE}/map/points?username=${currentUser.username}`)
                .then(data => {
                    allPoints = data.data;
                    document.getElementById('totalCount').textContent = allPoints.length;
                    if (worldMapLoaded && mapChart) refreshCurrentPoints();
                    const kw = document.getElementById('searchInput')?.value || '';
                    renderClassmatesList(kw);
                });
        }

        function refreshCurrentPoints() {
            if (mapLevel === 'world') renderWorldMap();
            else if (mapLevel === 'country') renderChinaMap();
            else if (mapLevel === 'province') renderProvinceMap();
            else if (mapLevel === 'city') renderCityMap();
        }

        function loadSelfInfo() {
            document.getElementById('editName').value = currentUser.name || '';
            document.getElementById('editCountry').value = currentUser.country || '';
            document.getElementById('editProvince').value = currentUser.province || '';
            document.getElementById('editCity').value = currentUser.city || '';
            document.getElementById('editDistrict').value = currentUser.district || '';
            document.getElementById('editMessage').value = currentUser.message || '';
        }

        function saveSelfInfo() {
            const name = document.getElementById('editName').value.trim();
            const country = document.getElementById('editCountry').value.trim();
            if (!name || !country) { alert('姓名和国家为必填项'); return; }
            const btn = document.getElementById('saveSelfBtn');
            btn.disabled = true;
            btn.textContent = '保存中…';
            const data = {
                name,
                country,
                province: document.getElementById('editProvince').value.trim(),
                city: document.getElementById('editCity').value.trim(),
                district: document.getElementById('editDistrict').value.trim(),
                message: document.getElementById('editMessage').value.trim()
            };
            request(`${API_BASE}/user/self?username=${encodeURIComponent(currentUser.username)}`, { method: 'PUT', body: JSON
                        .stringify(data) })
                .then(res => {
                    btn.disabled = false;
                    btn.textContent = '保存修改';
                    if (res.code === 200) {
                        alert('保存成功');
                        currentUser = res.data;
                        localStorage.setItem('currentUser', JSON.stringify(res.data));
                        const roleText = { 'admin': '管理员', 'user': '成员', 'teacher': '老师' }[currentUser.role] ||
                        '成员';
                        document.getElementById('currentUserName').textContent = currentUser.name + '（' + roleText +
                        '）';
                        loadMapPoints();
                    } else alert(res.msg || '保存失败');
                })
                .catch(() => { btn.disabled = false;
                    btn.textContent = '保存修改'; });
        }

        function showChangePwdModal() {
            document.getElementById('oldPwd').value = '';
            document.getElementById('newPwd').value = '';
            document.getElementById('confirmNewPwd').value = '';
            document.getElementById('changePwdModal').style.display = 'block';
        }

        function closeChangePwdModal() { document.getElementById('changePwdModal').style.display = 'none'; }

        function submitChangePwd() {
            const oldPwd = document.getElementById('oldPwd').value.trim();
            const newPwd = document.getElementById('newPwd').value.trim();
            const confirmPwd = document.getElementById('confirmNewPwd').value.trim();
            if (!oldPwd || !newPwd || !confirmPwd) { alert('请填写完整密码信息'); return; }
            if (newPwd !== confirmPwd) { alert('两次输入的新密码不一致'); return; }
            if (newPwd.length < 6) { alert('新密码长度不能少于6位'); return; }
            const btn = document.getElementById('changePwdBtn');
            btn.disabled = true;
            btn.textContent = '修改中…';
            request(`${API_BASE}/user/change-password`, {
                    method: 'POST',
                    body: JSON.stringify({ username: currentUser.username, old_password: oldPwd, new_password: newPwd,
                        confirm_password: confirmPwd })
                })
                .then(res => {
                    btn.disabled = false;
                    btn.textContent = '确认修改';
                    if (res.code === 200) { alert('密码修改成功，请重新登录');
                        closeChangePwdModal();
                        logout(); } else alert(res.msg || '密码修改失败');
                })
                .catch(() => { btn.disabled = false;
                    btn.textContent = '确认修改'; });
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.getElementById('classmatesPanel').style.display = 'none';
            document.getElementById('selfPanel').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'none';
            if (type === 'classmates') {
                document.querySelector('.tab-item:nth-child(1)').classList.add('active');
                document.getElementById('classmatesPanel').style.display = 'flex';
            } else if (type === 'self') {
                document.querySelector('.tab-item:nth-child(2)').classList.add('active');
                document.getElementById('selfPanel').style.display = 'flex';
            } else {
                document.querySelector('.tab-item:nth-child(3)').classList.add('active');
                document.getElementById('adminPanel').style.display = 'flex';
                loadAdminUserList();
            }
        }

        function loadAdminUserList() {
            request(`${API_BASE}/admin/users?admin_name=${encodeURIComponent(currentUser.username)}`)
                .then(res => { if (res.code === 200) { adminUserList = res.data;
                        renderUserList(res.data); } else alert(res.msg); });
        }

        function renderUserList(users) {
            const container = document.getElementById('userList');
            const roleMap = { 'admin': '管理员', 'user': '成员', 'teacher': '老师' };
            container.innerHTML = users.map(u => `
                <div class="user-item">
                    <div class="name-row"><span class="name">${u.name}</span><span class="role">${roleMap[u.role] || '成员'}</span></div>
                    <div class="loc">${u.country} ${u.province||''} ${u.city||''} ${u.district||''}</div>
                    <div class="ops">
                        <button onclick="editUser('${u.username}')">编辑</button>
                        <button onclick="resetUserPwd('${u.username}')">重置密码</button>
                        <button onclick="deleteUser('${u.username}')">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function showAddModal() {
            adminModalMode = 'add';
            currentEditUsername = '';
            document.getElementById('adminModalTitle').textContent = '新增用户';
            document.getElementById('adminEditUsername').disabled = false;
            document.getElementById('adminEditUsernameGroup').style.display = 'block';
            document.getElementById('pwdRequiredTip').style.display = 'inline';
            document.getElementById('adminEditUsername').value = '';
            document.getElementById('adminEditName').value = '';
            document.getElementById('adminEditPassword').value = '';
            document.getElementById('adminEditRole').value = 'user';
            document.getElementById('adminEditCountry').value = '中国';
            document.getElementById('adminEditProvince').value = '';
            document.getElementById('adminEditCity').value = '';
            document.getElementById('adminEditDistrict').value = '';
            document.getElementById('adminEditMessage').value = '';
            document.getElementById('adminEditModal').style.display = 'block';
        }

        function editUser(username) {
            let user = adminUserList.find(u => u.username === username);
            if (!user) user = allPoints.find(p => p.username === username);
            if (!user) { alert('未找到对应用户'); return; }
            adminModalMode = 'edit';
            currentEditUsername = username;
            document.getElementById('adminModalTitle').textContent = '编辑用户信息';
            document.getElementById('adminEditUsername').disabled = true;
            document.getElementById('adminEditUsernameGroup').style.display = 'block';
            document.getElementById('pwdRequiredTip').style.display = 'none';
            document.getElementById('adminEditUsername').value = user.username;
            document.getElementById('adminEditName').value = user.name || '';
            document.getElementById('adminEditPassword').value = '';
            document.getElementById('adminEditRole').value = user.role || 'user';
            document.getElementById('adminEditCountry').value = user.country || '';
            document.getElementById('adminEditProvince').value = user.province || '';
            document.getElementById('adminEditCity').value = user.city || '';
            document.getElementById('adminEditDistrict').value = user.district || '';
            document.getElementById('adminEditMessage').value = user.message || '';
            document.getElementById('adminEditModal').style.display = 'block';
        }

        function resetUserPwd(username) {
            const newPwd = prompt('请输入新密码', '123456');
            if (!newPwd || newPwd.length < 6) return alert('密码长度不能少于6位');
            request(`${API_BASE}/admin/users/${encodeURIComponent(username)}?admin_name=${encodeURIComponent(currentUser.username)}`, {
                    method: 'PUT',
                    body: JSON.stringify({ password: newPwd })
                }).then(res => alert(res.msg));
        }

        function closeAdminModal() { document.getElementById('adminEditModal').style.display = 'none';
            currentEditUsername = '';
            adminModalMode = 'edit'; }

        function saveAdminEdit() {
            const btn = document.getElementById('saveAdminBtn');
            const name = document.getElementById('adminEditName').value.trim();
            const country = document.getElementById('adminEditCountry').value.trim();
            const role = document.getElementById('adminEditRole').value;
            if (!name || !country) { alert('姓名和国家为必填项'); return; }

            if (adminModalMode === 'add') {
                const username = document.getElementById('adminEditUsername').value.trim();
                const password = document.getElementById('adminEditPassword').value.trim();
                if (!username || !password || password.length < 6) return alert('用户名和密码不能为空且密码长度至少6位');
                btn.disabled = true;
                btn.textContent = '保存中…';
                const data = { username, password, name, country, role,
                    province: document.getElementById('adminEditProvince').value.trim(),
                    city: document.getElementById('adminEditCity').value.trim(),
                    district: document.getElementById('adminEditDistrict').value.trim(),
                    message: document.getElementById('adminEditMessage').value.trim()
                };
                request(`${API_BASE}/admin/users?admin_name=${encodeURIComponent(currentUser.username)}`, { method: 'POST',
                        body: JSON.stringify(data) })
                    .then(res => {
                        btn.disabled = false;
                        btn.textContent = '保存';
                        if (res.code === 200) { alert('新增成功');
                            closeAdminModal();
                            loadAdminUserList();
                            loadMapPoints(); } else alert(res.msg || '新增失败');
                    })
                    .catch(() => { btn.disabled = false;
                        btn.textContent = '保存'; });
            } else {
                if (!currentEditUsername) return;
                const data = { name, country, role,
                    province: document.getElementById('adminEditProvince').value.trim(),
                    city: document.getElementById('adminEditCity').value.trim(),
                    district: document.getElementById('adminEditDistrict').value.trim(),
                    message: document.getElementById('adminEditMessage').value.trim()
                };
                const pwdVal = document.getElementById('adminEditPassword').value.trim();
                if (pwdVal) { if (pwdVal.length < 6) return alert('密码长度不能少于6位');
                    data.password = pwdVal; }
                btn.disabled = true;
                btn.textContent = '保存中…';
                request(`${API_BASE}/admin/users/${encodeURIComponent(currentEditUsername)}?admin_name=${encodeURIComponent(currentUser.username)}`, { method: 'PUT',
                        body: JSON.stringify(data) })
                    .then(res => {
                        btn.disabled = false;
                        btn.textContent = '保存';
                        if (res.code === 200) {
                            alert('修改成功');
                            closeAdminModal();
                            loadAdminUserList();
                            loadMapPoints();
                            if (currentEditUsername === currentUser.username) {
                                currentUser = { ...currentUser, ...data };
                                delete currentUser.password;
                                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                                const roleText = { 'admin': '管理员', 'user': '成员', 'teacher': '老师' }[
                                    currentUser.role] || '成员';
                                document.getElementById('currentUserName').textContent = currentUser.name +
                                    '（' + roleText + '）';
                                loadSelfInfo();
                            }
                        } else alert(res.msg || '修改失败');
                    })
                    .catch(() => { btn.disabled = false;
                        btn.textContent = '保存'; });
            }
        }

        function deleteUser(username) {
            if (username === currentUser.username) return alert('不能删除当前登录账号');
            if (!confirm('确定删除？')) return;
            request(`${API_BASE}/admin/users/${encodeURIComponent(username)}?admin_name=${encodeURIComponent(currentUser.username)}`, { method: 'DELETE' })
                .then(res => { alert(res.msg);
                    loadAdminUserList();
                    loadMapPoints(); });
        }

        function logout() { localStorage.removeItem('currentUser');
            window.location.href = '/'; }

        window.onload = function() {
            if (!currentUser) { window.location.href = '/'; return; }
            const roleText = { 'admin': '管理员', 'user': '成员', 'teacher': '老师' }[currentUser.role] || '成员';
            document.getElementById('currentUserName').textContent = currentUser.name + '（' + roleText + '）';
            if (currentUser.role === 'admin') document.getElementById('adminTab').style.display = 'block';
            mapChart = echarts.init(document.getElementById('map'));
            window.addEventListener('resize', () => mapChart.resize());
            document.addEventListener('keydown', e => { if (e.key === 'Escape') goBack(); });
            loadMapPoints();
            loadSelfInfo();
            initWorldMap();
        };

        window.toggleLike = toggleLike;
        window.openStudentDetail = openStudentDetail;
        window.closeStudentDetail = closeStudentDetail;
        window.submitComment = submitComment;
        window.deleteComment = deleteComment;
        window.setReplyParent = setReplyParent;
        window.showAddModal = showAddModal;
        window.editUser = editUser;
        window.resetUserPwd = resetUserPwd;
        window.deleteUser = deleteUser;
        window.closeAdminModal = closeAdminModal;
        window.saveAdminEdit = saveAdminEdit;
        window.switchTab = switchTab;
        window.goBack = goBack;
        window.saveSelfInfo = saveSelfInfo;
        window.logout = logout;
    </script>
</body>
</html>
