<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毕业地图 · 在地球上见</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5efe6;
            font-family: "Songti SC", "SimSun", "Microsoft YaHei", serif;
            color: #5a4a35;
            height: 100vh;
            overflow: hidden;
        }

        /* 顶部标题栏 */
        .header {
            height: 90px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fffdf8;
            border-bottom: 1px solid #e8dccc;
        }

        .header-left h2 {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .header-left p {
            font-size: 13px;
            color: #998670;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
        }

        .user-info {
            color: #7a6a55;
        }

        .logout-btn {
            padding: 6px 16px;
            border: 1px solid #c7b59a;
            border-radius: 4px;
            background: transparent;
            color: #8b6f4e;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #8b6f4e;
            color: #fff;
        }

        /* 主体区域 */
        .main {
            display: flex;
            height: calc(100vh - 90px);
        }

        /* 地图区域 */
        .map-container {
            flex: 1;
            position: relative;
            background: #f5efe6;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            background: #fffdf8;
            border: 1px solid #e8dccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: #7a6a55;
            display: none;
            font-family: inherit;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            z-index: 10;
            transition: all 0.2s;
        }

        .map-back-btn:hover {
            background: #f0e6d6;
            border-color: #c7b59a;
        }

        .map-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #998670;
            font-size: 14px;
            z-index: 9;
            background: rgba(255, 253, 248, 0.95);
            padding: 12px 24px;
            border-radius: 4px;
            border: 1px solid #e8dccc;
            display: none;
            text-align: center;
            line-height: 1.8;
        }

        .map-loading button {
            margin-top: 8px;
            padding: 4px 12px;
            border: 1px solid #c7b59a;
            background: #fff;
            border-radius: 3px;
            color: #8b6f4e;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }

        .map-stats {
            position: absolute;
            bottom: 30px;
            left: 40px;
        }

        .map-stats .en {
            font-size: 13px;
            color: #998670;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .map-stats .cn {
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 4px;
        }

        .map-stats .count {
            position: absolute;
            right: -80px;
            bottom: 8px;
            font-size: 20px;
            color: #c0504d;
        }

        /* 右侧侧边栏 */
        .sidebar {
            width: 340px;
            background: #fffdf8;
            border-left: 1px solid #e8dccc;
            padding: 24px;
            overflow-y: auto;
        }

        /* 侧边栏滚动条美化 */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: #f0e6d6;
            border-radius: 3px;
            margin: 4px 0;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #c7b59a;
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #b09d80;
        }

        .tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid #e8dccc;
            padding-bottom: 12px;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            color: #998670;
            transition: all 0.2s;
            user-select: none;
        }

        .tab-item.active {
            background: #f0e6d6;
            color: #8b6f4e;
        }

        .admin-tab {
            display: none;
        }

        /* 搜索框 */
        .search-box {
            margin-bottom: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d9cbb8;
            border-radius: 4px;
            background: #faf7f2;
            font-size: 13px;
            color: #5a4a35;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #c7b59a;
        }

        /* 同学列表 */
        .classmates-list {
            margin-top: 10px;
        }

        .classmate-item {
            padding: 12px;
            border: 1px solid #e8dccc;
            border-radius: 6px;
            margin-bottom: 10px;
            background: #faf7f2;
            cursor: pointer;
            transition: all 0.2s;
        }

        .classmate-item:hover {
            background: #f0e6d6;
            border-color: #c7b59a;
            transform: translateX(2px);
        }

        .classmate-name {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .classmate-loc {
            font-size: 12px;
            color: #998670;
            margin-bottom: 6px;
        }

        .classmate-msg {
            font-size: 12px;
            color: #7a6a55;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 点赞按钮 */
        .like-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #998670;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .like-btn:hover {
            color: #c0504d;
            transform: scale(1.05);
        }
        .like-btn.liked {
            color: #c0504d;
        }
        .like-btn .heart {
            font-size: 14px;
            line-height: 1;
        }

        /* ========== 新增：老师账号留言提示样式 ========== */
        .msg-hide-tip {
            color: #b09d80;
            font-style: italic;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #7a6a55;
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #d9cbb8;
            border-radius: 4px;
            background: #faf7f2;
            font-size: 13px;
            color: #5a4a35;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: #c7b59a;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .save-btn {
            width: 100%;
            padding: 10px;
            background: #8b6f4e;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 2px;
            font-family: inherit;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .save-btn:hover:not(:disabled) {
            background: #7a5f40;
        }

        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .cancel-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            color: #8b6f4e;
            border: 1px solid #c7b59a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 2px;
            font-family: inherit;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .cancel-btn:hover {
            background: #f0e6d6;
        }

        /* 用户管理列表 */
        .user-list {
            margin-top: 10px;
        }

        .user-item {
            padding: 12px;
            border: 1px solid #e8dccc;
            border-radius: 6px;
            margin-bottom: 10px;
            background: #faf7f2;
        }

        .user-item .name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .user-item .name {
            font-size: 15px;
            font-weight: 500;
        }

        .user-item .role {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 3px;
            background: #e8dccc;
            color: #8b6f4e;
        }

        .user-item .loc {
            font-size: 12px;
            color: #998670;
            margin-bottom: 8px;
        }

        .user-item .ops {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .user-item button {
            flex: 1;
            min-width: 48px;
            padding: 4px 0;
            font-size: 12px;
            border: 1px solid #c7b59a;
            background: transparent;
            border-radius: 3px;
            cursor: pointer;
            color: #7a6a55;
            font-family: inherit;
            transition: background 0.2s;
        }

        .user-item button:hover {
            background: #f0e6d6;
        }

        .add-user-btn {
            width: 100%;
            padding: 10px;
            border: 1px dashed #c7b59a;
            background: transparent;
            color: #8b6f4e;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .add-user-btn:hover {
            background: #f0e6d6;
            border-style: solid;
        }

        /* 弹窗通用样式 */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            z-index: 9999;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fffdf8;
            padding: 24px;
            border-radius: 8px;
            width: 420px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 10000;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
            color: #5a4a35;
            text-align: center;
            letter-spacing: 2px;
        }

        .modal-btns {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .modal-btns button {
            flex: 1;
        }

        .form-tip {
            font-size: 12px;
            color: #998670;
            margin-top: -4px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
<!-- 顶部 -->
<div class="header">
    <div class="header-left">
        <h2>学军紫金港2025届4班 · 毕业地图</h2>
        <p>班主任：王畅</p>
    </div>
    <div class="header-right">
        <span class="user-info" id="currentUserName"></span>
        <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>
</div>

<!-- 主体 -->
<div class="main">
    <!-- 地图 -->
    <div class="map-container">
        <button class="map-back-btn" id="backBtn" onclick="goBack()">← 返回上一级</button>
        <div class="map-loading" id="mapLoading">地图加载中...</div>
        <div id="map"></div>
        <div class="map-stats">
            <div class="en">PEOPLE AROUND THE WORLD</div>
            <div class="cn">在地球上遇见<span class="count" id="totalCount">0</span>各位</div>
        </div>
    </div>

    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="tab-bar">
            <div class="tab-item active" onclick="switchTab('classmates')">同学列表</div>
            <div class="tab-item" onclick="switchTab('self')">我的信息</div>
            <div class="tab-item admin-tab" id="adminTab" onclick="switchTab('admin')">用户管理</div>
        </div>

        <!-- 同学列表面板 -->
        <div id="classmatesPanel">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索同学姓名..."
                       oninput="filterClassmates(this.value)">
            </div>
            <div class="classmates-list" id="classmatesList"></div>
        </div>

        <!-- 个人信息面板 -->
        <div id="selfPanel" style="display:none;">
            <div class="form-group">
                <label>姓名 <span style="color:#c0504d;">*</span></label>
                <input type="text" id="editName">
            </div>
            <div class="form-group">
                <label>国家 <span style="color:#c0504d;">*</span></label>
                <input type="text" id="editCountry">
            </div>
            <div class="form-group">
                <label>省份</label>
                <input type="text" id="editProvince" placeholder="国内填写">
            </div>
            <div class="form-group">
                <label>城市</label>
                <input type="text" id="editCity">
            </div>
            <div class="form-group">
                <label>区县</label>
                <input type="text" id="editDistrict" placeholder="国内填写">
            </div>
            <div class="form-group">
                <label>毕业留言</label>
                <textarea id="editMessage"></textarea>
            </div>
            <button class="save-btn" id="saveSelfBtn" onclick="saveSelfInfo()">保存修改</button>
            <button class="cancel-btn" onclick="showChangePwdModal()">修改密码</button>
        </div>

        <!-- 管理员面板 -->
        <div id="adminPanel" style="display:none;">
            <button class="add-user-btn" onclick="showAddModal()">+ 新增用户</button>
            <div class="user-list" id="userList"></div>
        </div>
    </div>
</div>

<!-- 管理员编辑用户弹窗 -->
<div class="modal-mask" id="adminEditModal" onclick="if(event.target===this) closeAdminModal()">
    <div class="modal-content">
        <div class="modal-title" id="adminModalTitle">编辑用户信息</div>
        <!-- ========== 新增：用户名字段（新增时可填，编辑时禁用） ========== -->
        <div class="form-group" id="adminEditUsernameGroup">
            <label>账号 <span style="color:#c0504d;">*</span></label>
            <input type="text" id="adminEditUsername" placeholder="登录用的用户名">
        </div>
        <div class="form-group">
            <label>姓名 <span style="color:#c0504d;">*</span></label>
            <input type="text" id="adminEditName">
        </div>
        <div class="form-group">
            <label>密码 <span id="pwdRequiredTip" style="color:#c0504d;display:none;">*</span></label>
            <input type="text" id="adminEditPassword" placeholder="留空则不修改密码">
            <div class="form-tip">编辑用户时留空保持原密码不变，新增用户必填</div>
        </div>
        <!-- ========== 新增：角色选择下拉框 ========== -->
        <div class="form-group">
            <label>用户角色</label>
            <select id="adminEditRole">
                <option value="user">普通成员（同学）</option>
                <option value="teacher">老师</option>
                <option value="admin">管理员</option>
            </select>
            <div class="form-tip">老师权限和普通成员一致，仅无法查看毕业留言与点赞功能</div>
        </div>
        <div class="form-group">
            <label>国家 <span style="color:#c0504d;">*</span></label>
            <input type="text" id="adminEditCountry">
        </div>
        <div class="form-group">
            <label>省份</label>
            <input type="text" id="adminEditProvince">
        </div>
        <div class="form-group">
            <label>城市</label>
            <input type="text" id="adminEditCity">
        </div>
        <div class="form-group">
            <label>区县</label>
            <input type="text" id="adminEditDistrict">
        </div>
        <div class="form-group">
            <label>毕业留言</label>
            <textarea id="adminEditMessage"></textarea>
        </div>
        <div class="modal-btns">
            <button class="cancel-btn" onclick="closeAdminModal()">取消</button>
            <button class="save-btn" id="saveAdminBtn" onclick="saveAdminEdit()">保存</button>
        </div>
    </div>
</div>

<!-- 个人修改密码弹窗 -->
<div class="modal-mask" id="changePwdModal" onclick="if(event.target===this) closeChangePwdModal()">
    <div class="modal-content" style="width: 360px;">
        <div class="modal-title">修改密码</div>
        <div class="form-group">
            <label>旧密码</label>
            <input type="password" id="oldPwd" placeholder="请输入当前密码">
        </div>
        <div class="form-group">
            <label>新密码</label>
            <input type="password" id="newPwd" placeholder="请输入新密码">
        </div>
        <div class="form-group">
            <label>确认新密码</label>
            <input type="password" id="confirmNewPwd" placeholder="请再次输入新密码">
        </div>
        <div class="modal-btns">
            <button class="cancel-btn" onclick="closeChangePwdModal()">取消</button>
            <button class="save-btn" id="changePwdBtn" onclick="submitChangePwd()">确认修改</button>
        </div>
    </div>
</div>

<script>
    // ========== 全局常量配置 ==========
    const API_BASE = '/api';
    const MAP_BASE = '/static/maps';

    // ========== 全局变量 ==========
    let currentUser = JSON.parse(localStorage.getItem('currentUser'));
    let mapChart = null;
    let mapLevel = 'world'; // world / country / province / city
    let currentGeoJson = null;
    let currentProvinceName = '';
    let currentCityName = '';
    let allPoints = [];
    let worldMapLoaded = false;
    let adminUserList = [];
    let currentEditUsername = '';
    // ========== 新增：标记当前弹窗是新增还是编辑模式 ==========
    let adminModalMode = 'edit'; // edit / add

    let loadMapLock = '';
    let locateTimer = null;

    // 省份中心坐标（简称key）

    // ========== 通用工具函数 ==========
    // 名称简化（兼容全称/简称）
    function shortName(name) {
        if (!name) return '';
        return name.trim()
                .replace(/省|市|区|县|自治区|特别行政区|壮族|回族|维吾尔/g, '');
    }

    // 统一请求封装
    function request(url, options = {}) {
        return fetch(url, {
            headers: {'Content-Type': 'application/json', ...options.headers},
            ...options
        })
                .then(res => res.json())
                .catch(err => {
                    console.error('请求失败:', err);
                    alert('网络请求失败，请检查服务状态');
                    throw err;
                });
    }

    // ========== 点位大小分级规则 ==========
    function getSymbolSize(val, params) {
        if (mapLevel === 'world') return 10;
        if (mapLevel === 'country') return 14;
        if (mapLevel === 'province') {
            const cityName = shortName(params.data?.city);
            if (!cityName) return 10;
            const count = allPoints.filter(p => shortName(p.city) === cityName).length;
            return 8 + count * 3;
        }
        if (mapLevel === 'city') {
            const districtName = shortName(params.data?.district);
            if (!districtName) return 10;
            const count = allPoints.filter(p => shortName(p.district) === districtName).length;
            return 8 + count * 3;
        }
        return 10;
    }

    // ========== 数据聚合函数 ==========

    function formatWorldPoints() {
        const cityMap = {};
        allPoints.forEach(p => {
            const cityName = p.city || p.province || '未知';
            const cityShort = shortName(cityName);
            if (!cityMap[cityShort]) {
                const coord = cityCoords[cityShort] || cityCoords[shortName(p.province)] || [0, 0];
                // 国外无坐标时不显示到中国默认位置
                if (p.country !== '中国' && coord[0] === 0 && coord[1] === 0) return;
                cityMap[cityShort] = {
                    name: cityName,
                    value: coord
                };
            }
        });
        return Object.values(cityMap);
    }

    function formatProvincePoints() {
        const provinceMap = {};
        allPoints.forEach(p => {
            if (p.country === '中国' && p.province) {
                const provShort = shortName(p.province);
                if (!provinceMap[provShort]) {
                    provinceMap[provShort] = {
                        name: p.province,
                        value: provinceCoords[provShort] || [104, 35]
                    };
                }
            }
        });
        return Object.values(provinceMap);
    }

    function formatCityPoints() {
        const cityMap = {};
        const targetShort = shortName(currentProvinceName);

        allPoints.forEach(p => {
            if (!p.city) return;
            const provShort = shortName(p.province || '');
            if (currentProvinceName && provShort !== targetShort) return;

            const cityName = p.city.trim();
            const cityShort = shortName(cityName);
            if (!cityMap[cityShort]) {
                cityMap[cityShort] = {
                    name: cityName,
                    value: cityCoords[cityShort] || provinceCoords[targetShort] || [120.15, 30.27],
                    city: cityName
                };
            }
        });
        return Object.values(cityMap);
    }

    function formatDistrictPoints() {
        const districtMap = {};
        const targetShort = shortName(currentCityName);

        allPoints.forEach(p => {
            if (!p.district || p.district.trim() === '') return;
            const cityShort = shortName(p.city || '');
            if (currentCityName && cityShort !== targetShort) return;

            const districtName = p.district.trim();
            const districtShort = shortName(districtName);
            if (!districtMap[districtShort]) {
                districtMap[districtShort] = {
                    name: districtName,
                    value: districtCoords[districtShort] || cityCoords[targetShort] || [120.15, 30.27],
                    district: districtName
                };
            }
        });
        return Object.values(districtMap);
    }

    // 生成点位tooltip内容（显示同学姓名）
    function getPointTooltip(name, level) {
        let list = [];
        if (level === 'world') {
            list = allPoints.filter(p => shortName(p.city || p.province) === shortName(name));
        } else if (level === 'country') {
            list = allPoints.filter(p => shortName(p.province) === shortName(name));
        } else if (level === 'province') {
            list = allPoints.filter(p => shortName(p.city) === shortName(name));
        } else if (level === 'city') {
            list = allPoints.filter(p => shortName(p.district) === shortName(name));
        }
        const names = list.map(p => p.name).join('、');
        return `${name}<br/>共 ${list.length} 位同学<br/><span style="font-size:12px;color:#998670;">${names || '暂无'}</span>`;
    }

    // ========== 同学列表渲染 + 搜索过滤 ==========
    function renderClassmatesList(keyword = '') {
        const container = document.getElementById('classmatesList');
        const list = [];
        const kw = keyword.trim().toLowerCase();
        // ========== 新增：判断当前用户是不是老师 ==========
        const isTeacher = currentUser.role === 'teacher';

        allPoints.forEach((p, i) => {
            if (p.username !== currentUser.username) {
                if (kw && !p.name.toLowerCase().includes(kw)) return;
                list.push({...p, index: i});
            }
        });

        if (list.length === 0) {
            container.innerHTML = '<div style="text-align:center;color:#998670;padding:40px 0;font-size:13px;">未找到匹配的同学</div>';
            return;
        }

        container.innerHTML = list.map(u => {
            const likeCount = u.likeCount || 0;
            const liked = u.liked || false;
            return `
                <div class="classmate-item" data-index="${u.index}" onclick="locateStudentByIndex(this)">
                    <div class="classmate-name">${u.name}</div>
                    <div class="classmate-loc">${u.country} ${u.province || ''} ${u.city || ''} ${u.district || ''}</div>
                    <!-- ========== 修改：老师账号显示不可查看提示，否则显示原留言 ========== -->
                    <div class="classmate-msg">
                        ${isTeacher ? '<span class="msg-hide-tip"> </span>' : (u.message || '暂无留言')}
                    </div>
                    ${isTeacher ? '' : `
                        <div class="like-btn ${liked ? 'liked' : ''}"
                             onclick="event.stopPropagation(); toggleLike('${u.username}', ${u.index})">
                            <span class="heart">${liked ? '♥' : '♡'}</span>
                            <span class="like-count">${likeCount}</span>
                        </div>
                    `}
                </div>
            `;
        }).join('');
    }

    // ========== 点赞切换 ==========
    function toggleLike(targetUsername, pointIndex) {
        if (likeLock) return;
        likeLock = true;

        request(`${API_BASE}/user/like`, {
            method: 'POST',
            body: JSON.stringify({
                username: currentUser.username,
                targetUsername: targetUsername
            })
        })
        .then(res => {
            if (res.code === 200) {
                // 更新本地数据
                allPoints[pointIndex].liked = res.data.liked;
                allPoints[pointIndex].likeCount = res.data.likeCount;
                // 刷新列表
                const kw = document.getElementById('searchInput')?.value || '';
                renderClassmatesList(kw);
            } else {
                alert(res.msg || '操作失败');
            }
        })
        .catch(() => {})
        .finally(() => {
            likeLock = false;
        });
    }

    function filterClassmates(keyword) {
        if (searchTimer) clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            renderClassmatesList(keyword);
        }, 300);
    }

    // ========== 定位到指定同学 ==========
    function locateStudentByIndex(el) {
        const idx = el.dataset.index;
        const student = allPoints[idx];
        if (student) locateStudent(student);
    }

    function locateStudent(student) {
        if (locateTimer) clearTimeout(locateTimer);
        if (highlightTimer) clearTimeout(highlightTimer);

        const country = student.country || '';
        const province = student.province || '';
        const city = student.city || '';
        const district = student.district || '';

        // 获取最优坐标
        let coord = null;
        let highlightName = '';
        if (district && districtCoords[shortName(district)]) {
            coord = districtCoords[shortName(district)];
            highlightName = district;
        } else if (city && cityCoords[shortName(city)]) {
            coord = cityCoords[shortName(city)];
            highlightName = city;
        } else if (province && provinceCoords[shortName(province)]) {
            coord = provinceCoords[shortName(province)];
            highlightName = province;
        } else if (cityCoords[shortName(city)]) {
            coord = cityCoords[shortName(city)];
            highlightName = city;
        }

        if (!coord) {
            alert('该同学位置信息不完整，无法定位');
            return;
        }

        // 国外：世界地图定位
        if (country !== '中国') {
            renderWorldMap();
            bindWorldClick();
            locateTimer = setTimeout(() => {
                mapChart.setOption({geo: {center: coord, zoom: 3}});
                highlightPoint(shortName(highlightName));
            }, 200);
            return;
        }

        // 国内无省份：中国地图定位
        if (!province) {
            loadChinaMap();
            locateTimer = setTimeout(() => {
                mapChart.setOption({geo: {center: coord, zoom: 2}});
                highlightPoint(shortName(highlightName));
            }, 500);
            return;
        }

        // 匹配省份adcode
        let provAdcode = null;
        for (let fullName in provinceAdcodeMap) {
            if (shortName(fullName) === shortName(province)) {
                provAdcode = provinceAdcodeMap[fullName];
                break;
            }
        }
        if (!provAdcode) {
            loadChinaMap();
            locateTimer = setTimeout(() => {
                mapChart.setOption({geo: {center: coord, zoom: 2}});
                highlightPoint(shortName(highlightName));
            }, 500);
            return;
        }

        // 有省份无城市：省级地图定位
        if (!city) {
            loadProvinceMap(provAdcode, province);
            locateTimer = setTimeout(() => {
                mapChart.setOption({geo: {center: coord, zoom: 1.6}});
                highlightPoint(shortName(highlightName));
            }, 500);
            return;
        }

        // 有城市无区县：省级地图定位到城市
        if (!district) {
            loadProvinceMap(provAdcode, province);
            locateTimer = setTimeout(() => {
                mapChart.setOption({geo: {center: coord, zoom: 2.2}});
                highlightPoint(shortName(highlightName));
            }, 500);
            return;
        }

        // 有区县：下钻到市级地图定位
        loadProvinceMap(provAdcode, province);
        locateTimer = setTimeout(() => {
            const cityAdcode = getAdcodeByName(currentGeoJson, city);
            if (cityAdcode) {
                loadCityMap(cityAdcode, city);
                locateTimer = setTimeout(() => {
                    mapChart.setOption({geo: {center: coord, zoom: 2.5}});
                    highlightPoint(shortName(highlightName));
                }, 500);
            } else {
                mapChart.setOption({geo: {center: coord, zoom: 2.2}});
                highlightPoint(shortName(highlightName));
            }
        }, 500);
    }

    // 高亮指定点位
    function highlightPoint(name) {
        if (!name || !mapChart) return;
        mapChart.dispatchAction({type: 'highlight', seriesIndex: 0, name: name});
        highlightTimer = setTimeout(() => {
            mapChart.dispatchAction({type: 'downplay', seriesIndex: 0, name: name});
        }, 2000);
    }

    // ========== 页面初始化 ==========
    window.onload = function () {
        if (!currentUser) {
            window.location.href = '/';
            return;
        }
        // ========== 修改：角色显示支持老师 ==========
        const roleText = {
            'admin': '管理员',
            'user': '成员',
            'teacher': '老师'
        }[currentUser.role] || '成员';
        document.getElementById('currentUserName').textContent =
                currentUser.name + '（' + roleText + '）';

        if (currentUser.role === 'admin') {
            document.getElementById('adminTab').style.display = 'block';
        }

        mapChart = echarts.init(document.getElementById('map'));
        window.addEventListener('resize', () => mapChart.resize());
        // ESC快捷键返回上一级
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') goBack();
        });

        loadMapPoints();
        loadSelfInfo();
        initWorldMap();
    };

    // ========== 通用地图加载（带缓存） ==========
    function loadMapJson(adcode, mapName) {
        const cacheKey = adcode;
        if (mapCache[cacheKey]) {
            return Promise.resolve(mapCache[cacheKey]);
        }
        return fetch(`${MAP_BASE}/${adcode}_full.json`)
                .then(res => {
                    if (!res.ok) throw new Error('地图文件不存在');
                    return res.json();
                })
                .then(geoJson => {
                    mapCache[cacheKey] = geoJson;
                    echarts.registerMap(mapName, geoJson);
                    return geoJson;
                });
    }

    // ========== 1. 世界地图 ==========
    function initWorldMap() {
        showLoading();
        const lockKey = 'world';
        loadMapLock = lockKey;

        if (mapCache['world']) {
            worldMapLoaded = true;
            hideLoading();
            renderWorldMap();
            bindWorldClick();
            return;
        }

        fetch(`${MAP_BASE}/world.json`)
                .then(res => {
                    if (!res.ok) throw new Error('世界地图文件不存在');
                    return res.json();
                })
                .then(worldJson => {
                    if (loadMapLock !== lockKey) return;
                    mapCache['world'] = worldJson;
                    echarts.registerMap('world', worldJson);
                    worldMapLoaded = true;
                    hideLoading();
                    renderWorldMap();
                    bindWorldClick();
                })
                .catch(() => {
                    if (loadMapLock !== lockKey) return;
                    document.getElementById('mapLoading').innerHTML =
                            '世界地图加载失败，请检查地图文件是否存在<br/><button onclick="initWorldMap()">重试</button>';
                });
    }

                    if (loadMapLock !== lockKey) return;
                    hideLoading();
                    alert(`市级地图加载失败，请检查 ${adcode}_full.json 文件是否存在`);
                });
    }

    function renderCityMap() {
        mapLevel = 'city';
        document.getElementById('backBtn').style.display = 'block';

        const option = {
            backgroundColor: '#f5efe6',
            tooltip: {
                show: true,
                backgroundColor: '#fffdf8',
                borderColor: '#e8dccc',
                borderWidth: 1,
                textStyle: {color: '#5a4a35', fontSize: 12},
                formatter: function (params) {
                    if (params.componentType === 'geo') {
                        return params.name;
                    }
                    return getPointTooltip(params.name, 'city');
                }
            },
            geo: {
                map: 'city',
                roam: true,
                zoom: 1.2,
                itemStyle: {
                    areaColor: '#e0d5c3',
                    borderColor: '#c7b59a',
                    borderWidth: 0.8
                },
                emphasis: {
                    itemStyle: {areaColor: '#d4c4a8'},
                    label: {show: true, color: '#5a4a35', fontSize: 12}
                }
            },
            series: [{
                type: 'scatter',
                coordinateSystem: 'geo',
                symbolSize: getSymbolSize,
                itemStyle: {
                    color: '#5a9ea8',
                    shadowBlur: 6,
                    shadowColor: 'rgba(90, 158, 168, 0.4)'
                },
                emphasis: {
                    itemStyle: {
                        color: '#c0504d',
                        shadowBlur: 10,
                        shadowColor: 'rgba(192, 80, 77, 0.5)'
                    }
                },
                data: formatDistrictPoints()
            }]
        };
        mapChart.setOption(option, true);
    }

    // ========== 返回上一级 ==========
    function goBack() {
        if (locateTimer) clearTimeout(locateTimer);
        if (highlightTimer) clearTimeout(highlightTimer);

        if (mapLevel === 'city') {
            currentCityName = '';
            if (!currentGeoJson || !currentGeoJson.features || currentGeoJson.features.length === 0) {
                loadChinaMap();
                return;
            }
            const cityCode = currentGeoJson.features[0].properties.adcode;
            const provCode = String(cityCode).slice(0, 2) + '0000';
            loadProvinceMap(provCode, currentProvinceName);
        } else if (mapLevel === 'province') {
            currentProvinceName = '';
            loadChinaMap();
        } else if (mapLevel === 'country') {
            renderWorldMap();
            bindWorldClick();
        }
    }

    // ========== 工具函数 ==========
    function getAdcodeByName(geoJson, name) {
        const targetShort = shortName(name);
        for (let feat of geoJson.features) {
            if (shortName(feat.properties.name) === targetShort) {
                return feat.properties.adcode;
            }
        }
        return null;
    }

    function showLoading() {
        document.getElementById('mapLoading').style.display = 'block';
        document.getElementById('mapLoading').innerHTML = '地图加载中...';
    }

    function hideLoading() {
        document.getElementById('mapLoading').style.display = 'none';
    }

    // ========== 点位数据加载 ==========
    function loadMapPoints() {
        request(`${API_BASE}/map/points?username=${currentUser.username}`)
                .then(data => {
                    allPoints = data.data;
                    document.getElementById('totalCount').textContent = allPoints.length;
                    if (worldMapLoaded && mapChart) {
                        refreshCurrentPoints();
                    }
                    const kw = document.getElementById('searchInput')?.value || '';
                    renderClassmatesList(kw);
                });
    }

    function refreshCurrentPoints() {
        if (mapLevel === 'world') renderWorldMap();
        else if (mapLevel === 'country') renderChinaMap();
        else if (mapLevel === 'province') renderProvinceMap();
        else if (mapLevel === 'city') renderCityMap();
    }

    // ========== 个人信息 ==========
    function loadSelfInfo() {
        document.getElementById('editName').value = currentUser.name || '';
        document.getElementById('editCountry').value = currentUser.country || '';
        document.getElementById('editProvince').value = currentUser.province || '';
        document.getElementById('editCity').value = currentUser.city || '';
        document.getElementById('editDistrict').value = currentUser.district || '';
        document.getElementById('editMessage').value = currentUser.message || '';
    }

    function saveSelfInfo() {
        const name = document.getElementById('editName').value.trim();
        const country = document.getElementById('editCountry').value.trim();

        if (!name || !country) {
            alert('姓名和国家为必填项');
            return;
        }

        const btn = document.getElementById('saveSelfBtn');
        btn.disabled = true;
        btn.textContent = '保存中...';

        const data = {
            name,
            country,
            province: document.getElementById('editProvince').value.trim(),
            city: document.getElementById('editCity').value.trim(),
            district: document.getElementById('editDistrict').value.trim(),
            message: document.getElementById('editMessage').value.trim()
        };

        request(`${API_BASE}/user/self?username=${encodeURIComponent(currentUser.username)}`, {
            method: 'PUT',
            body: JSON.stringify(data)
        })
                .then(res => {
                    btn.disabled = false;
                    btn.textContent = '保存修改';
                    if (res.code === 200) {
                        alert('保存成功');
                        currentUser = res.data;
                        localStorage.setItem('currentUser', JSON.stringify(res.data));
                        // ========== 修改：更新顶部角色显示 ==========
                        const roleText = {
                            'admin': '管理员',
                            'user': '成员',
                            'teacher': '老师'
                        }[currentUser.role] || '成员';
                        document.getElementById('currentUserName').textContent =
                                currentUser.name + '（' + roleText + '）';
                        loadMapPoints();
                    } else {
                        alert(res.msg || '保存失败');
                    }
                })
                .catch(() => {
                    btn.disabled = false;
                    btn.textContent = '保存修改';
                });
    }


    // ========== 个人修改密码 ==========
    function showChangePwdModal() {
        document.getElementById('oldPwd').value = '';
        document.getElementById('newPwd').value = '';
        document.getElementById('confirmNewPwd').value = '';
        document.getElementById('changePwdModal').style.display = 'block';
    }

    function closeChangePwdModal() {
        document.getElementById('changePwdModal').style.display = 'none';
    }

    function submitChangePwd() {
        const oldPwd = document.getElementById('oldPwd').value.trim();
        const newPwd = document.getElementById('newPwd').value.trim();
        const confirmPwd = document.getElementById('confirmNewPwd').value.trim();
        const btn = document.getElementById('changePwdBtn');

        if (!oldPwd || !newPwd || !confirmPwd) {
            alert('请填写完整密码信息');
            return;
        }
        if (newPwd !== confirmPwd) {
            alert('两次输入的新密码不一致');
            return;
        }
        if (newPwd.length < 6) {
            alert('新密码长度不能少于6位');
            return;
        }

        btn.disabled = true;
        btn.textContent = '修改中...';

        request(`${API_BASE}/user/change-password`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username: currentUser.username,
                old_password: oldPwd,
                new_password: newPwd,
                confirm_password: confirmPwd
            })
        })
                .then(res => {
                    btn.disabled = false;
                    btn.textContent = '确认修改';
                    if (res.code === 200) {
                        alert('密码修改成功，请重新登录');
                        closeChangePwdModal();
                        logout();
                    } else {
                        alert(res.msg || '密码修改失败');
                    }
                })
                .catch(() => {
                    btn.disabled = false;
                    btn.textContent = '确认修改';
                });
    }

    // ========== 关键修复：挂载到全局 window，让 HTML onclick 可以调用 ==========
    window.showChangePwdModal = showChangePwdModal;
    window.closeChangePwdModal = closeChangePwdModal;
    window.submitChangePwd = submitChangePwd;
    window.toggleLike = toggleLike;

    // ========== 标签切换 ==========
    function switchTab(type) {
        document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
        document.getElementById('classmatesPanel').style.display = 'none';
        document.getElementById('selfPanel').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'none';

        if (type === 'classmates') {
            document.querySelector('.tab-item:nth-child(1)').classList.add('active');
            document.getElementById('classmatesPanel').style.display = 'block';
        } else if (type === 'self') {
            document.querySelector('.tab-item:nth-child(2)').classList.add('active');
            document.getElementById('selfPanel').style.display = 'block';
        } else {
            document.querySelector('.tab-item:nth-child(3)').classList.add('active');
            document.getElementById('adminPanel').style.display = 'block';
            loadAdminUserList();
        }
    }

    // ========== 管理员功能 ==========
    function loadAdminUserList() {
        request(`${API_BASE}/admin/users?admin_name=${encodeURIComponent(currentUser.username)}`)
                .then(res => {
                    if (res.code === 200) {
                        adminUserList = res.data;
                        renderUserList(res.data);
                    } else {
                        alert(res.msg || '获取用户列表失败');
                    }
                });
    }

    function renderUserList(users) {
        const container = document.getElementById('userList');
        // ========== 修改：角色标签支持老师 ==========
        const roleMap = {
            'admin': '管理员',
            'user': '成员',
            'teacher': '老师'
        };
        container.innerHTML = users.map(u => `
                <div class="user-item">
                    <div class="name-row">
                        <span class="name">${u.name}</span>
                        <span class="role">${roleMap[u.role] || '成员'}</span>
                    </div>
                    <div class="loc">${u.country} ${u.province || ''} ${u.city || ''} ${u.district || ''}</div>
                    <div class="ops">
                        <button onclick="editUser('${u.username}')">编辑</button>
                        <button onclick="resetUserPwd('${u.username}')">重置密码</button>
                        <button onclick="deleteUser('${u.username}')">删除</button>
                    </div>
                </div>
            `).join('');
    }

    // ========== 修改：打开新增/编辑用户弹窗 ==========
    function showAddModal() {
        // 标记为新增模式
        adminModalMode = 'add';
        currentEditUsername = '';
        document.getElementById('adminModalTitle').textContent = '新增用户';
        // 用户名输入框启用
        document.getElementById('adminEditUsername').disabled = false;
        document.getElementById('adminEditUsernameGroup').style.display = 'block';
        // 密码必填提示显示
        document.getElementById('pwdRequiredTip').style.display = 'inline';

        // 清空所有表单
        document.getElementById('adminEditUsername').value = '';
        document.getElementById('adminEditName').value = '';
        document.getElementById('adminEditPassword').value = '';
        document.getElementById('adminEditRole').value = 'user'; // 默认普通成员
        document.getElementById('adminEditCountry').value = '中国';
        document.getElementById('adminEditProvince').value = '';
        document.getElementById('adminEditCity').value = '';
        document.getElementById('adminEditDistrict').value = '';
        document.getElementById('adminEditMessage').value = '';

        document.getElementById('adminEditModal').style.display = 'block';
    }

    // 打开编辑弹窗
    function editUser(username) {
        let user = adminUserList.find(u => u.username === username);
        if (!user) {
            user = allPoints.find(p => p.username === username);
        }

        if (!user) {
            alert('未找到对应用户信息，请刷新页面重试');
            return;
        }

        // 标记为编辑模式
        adminModalMode = 'edit';
        currentEditUsername = username;
        document.getElementById('adminModalTitle').textContent = '编辑用户信息';
        // 用户名输入框禁用，不能修改
        document.getElementById('adminEditUsername').disabled = true;
        document.getElementById('adminEditUsernameGroup').style.display = 'block';
        // 密码必填提示隐藏
        document.getElementById('pwdRequiredTip').style.display = 'none';

        // 填充表单
        document.getElementById('adminEditUsername').value = user.username;
        document.getElementById('adminEditName').value = user.name || '';
        document.getElementById('adminEditPassword').value = '';
        // ========== 新增：填充角色 ==========
        document.getElementById('adminEditRole').value = user.role || 'user';
        document.getElementById('adminEditCountry').value = user.country || '';
        document.getElementById('adminEditProvince').value = user.province || '';
        document.getElementById('adminEditCity').value = user.city || '';
        document.getElementById('adminEditDistrict').value = user.district || '';
        document.getElementById('adminEditMessage').value = user.message || '';

        document.getElementById('adminEditModal').style.display = 'block';
    }

    // 快速重置密码
    function resetUserPwd(username) {
        const newPwd = prompt('请输入新密码', '1233456');
        if (!newPwd) return;
        if (newPwd.length < 6) {
            alert('密码长度不能少于6位');
            return;
        }

        request(`${API_BASE}/admin/users/${encodeURIComponent(username)}?admin_name=${encodeURIComponent(currentUser.username)}`, {
            method: 'PUT',
            body: JSON.stringify({password: newPwd})
        })
                .then(res => {
                    alert(res.msg || '重置成功');
                });
    }

    // 关闭编辑弹窗
    function closeAdminModal() {
        document.getElementById('adminEditModal').style.display = 'none';
        currentEditUsername = '';
        adminModalMode = 'edit';
    }

    // 保存管理员编辑/新增
    function saveAdminEdit() {
        const btn = document.getElementById('saveAdminBtn');
        const name = document.getElementById('adminEditName').value.trim();
        const country = document.getElementById('adminEditCountry').value.trim();
        const role = document.getElementById('adminEditRole').value;

        if (!name || !country) {
            alert('姓名和国家为必填项');
            return;
        }

        // 新增模式：校验用户名和密码
        if (adminModalMode === 'add') {
            const username = document.getElementById('adminEditUsername').value.trim();
            const password = document.getElementById('adminEditPassword').value.trim();
            if (!username) {
                alert('请输入用户名');
                return;
            }
            if (!password) {
                alert('请设置初始密码');
                return;
            }
            if (password.length < 6) {
                alert('密码长度不能少于6位');
                return;
            }

            btn.disabled = true;
            btn.textContent = '保存中...';

            const data = {
                username,
                password,
                name,
                country,
                role: role,
                province: document.getElementById('adminEditProvince').value.trim(),
                city: document.getElementById('adminEditCity').value.trim(),
                district: document.getElementById('adminEditDistrict').value.trim(),
                message: document.getElementById('adminEditMessage').value.trim()
            };

            // 调用新增接口
            request(`${API_BASE}/admin/users?admin_name=${encodeURIComponent(currentUser.username)}`, {
                method: 'POST',
                body: JSON.stringify(data)
            })
                    .then(res => {
                        btn.disabled = false;
                        btn.textContent = '保存';
                        if (res.code === 200) {
                            alert('新增成功');
                            closeAdminModal();
                            loadAdminUserList();
                            loadMapPoints();
                        } else {
                            alert(res.msg || '新增失败');
                        }
                    })
                    .catch(err => {
                        btn.disabled = false;
                        btn.textContent = '保存';
                        console.error(err);
                    });

        } else {
            // 编辑模式：原有逻辑 + 角色字段
            if (!currentEditUsername) return;

            const data = {
                name,
                country,
                role: role, // 新增角色字段
                province: document.getElementById('adminEditProvince').value.trim(),
                city: document.getElementById('adminEditCity').value.trim(),
                district: document.getElementById('adminEditDistrict').value.trim(),
                message: document.getElementById('adminEditMessage').value.trim()
            };

            const pwdVal = document.getElementById('adminEditPassword').value.trim();
            if (pwdVal) {
                if (pwdVal.length < 6) {
                    alert('密码长度不能少于6位');
                    btn.disabled = false;
                    btn.textContent = '保存';
                    return;
                }
                data.password = pwdVal;
            }

            btn.disabled = true;
            btn.textContent = '保存中...';

            request(`${API_BASE}/admin/users/${encodeURIComponent(currentEditUsername)}?admin_name=${encodeURIComponent(currentUser.username)}`, {
                method: 'PUT',
                body: JSON.stringify(data)
            })
                    .then(res => {
                        btn.disabled = false;
                        btn.textContent = '保存';
                        if (res.code === 200) {
                            alert('修改成功');
                            closeAdminModal();
                            loadAdminUserList();
                            loadMapPoints();
                            if (currentEditUsername === currentUser.username) {
                                currentUser = {...currentUser, ...data};
                                // 移除密码字段，避免存到本地
                                delete currentUser.password;
                                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                                // 更新顶部角色显示
                                const roleText = {
                                    'admin': '管理员',
                                    'user': '成员',
                                    'teacher': '老师'
                                }[currentUser.role] || '成员';
                                document.getElementById('currentUserName').textContent =
                                        currentUser.name + '（' + roleText + '）';
                                loadSelfInfo();
                            }
                        } else {
                            alert(res.msg || '修改失败');
                        }
                    })
                    .catch(err => {
                        btn.disabled = false;
                        btn.textContent = '保存';
                        console.error(err);
                    });
        }
    }

    function deleteUser(username) {
        if (username === currentUser.username) {
            alert('不能删除当前登录账号');
            return;
        }
        if (!confirm('确定要删除该用户吗？删除后不可恢复')) return;
        request(`${API_BASE}/admin/users/${encodeURIComponent(username)}?admin_name=${encodeURIComponent(currentUser.username)}`, {
            method: 'DELETE'
        })
                .then(res => {
                    alert(res.msg || '删除成功');
                    loadAdminUserList();
                    loadMapPoints();
                });
    }

    // ========== 退出登录 ==========
    function logout() {
        localStorage.removeItem('currentUser');
        window.location.href = '/';
    }
</script>
</body>
</html>
