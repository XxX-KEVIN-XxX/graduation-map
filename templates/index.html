<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毕业地图 · 在地球上见</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #f7f1e8 0%, #f0e6d6 100%);
            background-image: linear-gradient(135deg, #f7f1e8 0%, #f0e6d6 100%),
            url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23d4c4a8' fill-opacity='0.08' fill-rule='evenodd'/%3E%3C/svg%3E");
            background-blend-mode: overlay;
            color: #5a4a35;
        }

        /* ========== 顶部标题栏 ========== */
        .header {
            width: 100%;
            height: 80px;
            padding: 0 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 253, 248, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(232, 220, 204, 0.8);
            box-shadow: 0 2px 12px rgba(139, 111, 78, 0.06);
            position: relative;
            z-index: 10;
        }

        .header-left h2 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 3px;
            color: #5a4a35;
        }

        .logout-btn {
            padding: 7px 18px;
            border: 1px solid #c2a67d;
            background: #fffdf8;
            color: #8b6f4e;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logout-btn:hover {
            background: #8b6f4e;
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 111, 78, 0.2);
        }

        /* ========== 主体区域 ========== */
        .main {
            width: 100%;
            height: calc(100% - 80px);
            display: flex;
            position: relative;
        }

        .map-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #mapChart {
            width: 100%;
            height: 100%;
        }

        /* 地图返回按钮 */
        .map-back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            border: 1px solid #e8dccc;
            border-radius: 8px;
            background: rgba(255, 253, 248, 0.9);
            backdrop-filter: blur(8px);
            color: #8b6f4e;
            cursor: pointer;
            font-size: 14px;
            z-index: 5;
            box-shadow: 0 4px 12px rgba(139, 111, 78, 0.1);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: none;
        }

        .map-back-btn:hover {
            transform: translateX(-2px);
            box-shadow: 0 6px 16px rgba(139, 111, 78, 0.15);
        }

        /* 地图统计文字 */
        .map-stats {
            position: absolute;
            bottom: 30px;
            left: 40px;
            z-index: 5;
        }

        .map-stats .cn {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 6px;
            color: #5a4a35;
            display: block;
        }

        .map-stats .count {
            font-size: 26px;
            font-weight: 600;
            color: #c0504d;
            font-family: "Times New Roman", serif;
            margin-left: 10px;
        }

        /* ========== 右侧侧边栏 ========== */
        .sidebar {
            width: 360px;
            height: 100%;
            background: rgba(255, 253, 248, 0.9);
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(232, 220, 204, 0.8);
            padding: 28px 24px;
            box-shadow: -4px 0 20px rgba(139, 111, 78, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 标签切换栏 */
        .tab-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            padding: 4px;
            border-radius: 8px;
            background: #f0e6d6;
            flex-shrink: 0;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            padding: 9px 0;
            font-size: 14px;
            color: #8b7d6b;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-item.active {
            background: #fffdf8;
            color: #8b6f4e;
            box-shadow: 0 2px 8px rgba(139, 111, 78, 0.12);
        }

        /* 搜索框 */
        .search-box {
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e0d4c0;
            background: #faf7f2;
            border-radius: 6px;
            font-size: 14px;
            color: #5a4a35;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-box input:focus {
            outline: none;
            border-color: #8b6f4e;
            box-shadow: 0 0 0 3px rgba(139, 111, 78, 0.1);
            background: #fff;
        }

        /* 同学列表 */
        .classmate-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .classmate-item {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #faf7f2;
            border-left: 3px solid transparent;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .classmate-item:hover {
            background: #fff;
            border-left-color: #8b6f4e;
            box-shadow: 0 4px 16px rgba(139, 111, 78, 0.1);
        }

        .classmate-item .name {
            font-size: 15px;
            font-weight: 500;
            color: #5a4a35;
            margin-bottom: 4px;
        }

        .classmate-item .info {
            font-size: 12px;
            color: #8b7d6b;
        }

        /* 表单区域 */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #6b5a45;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e0d4c0;
            background: #faf7f2;
            border-radius: 6px;
            font-size: 14px;
            color: #5a4a35;
            font-family: inherit;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #8b6f4e;
            box-shadow: 0 0 0 3px rgba(139, 111, 78, 0.1);
            background: #fff;
        }

        .submit-btn {
            width: 100%;
            padding: 11px 0;
            border: none;
            background: linear-gradient(135deg, #a6855e 0%, #8b6f4e 100%);
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
            letter-spacing: 2px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(139, 111, 78, 0.25);
        }

        /* ========== 弹窗 ========== */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(60, 45, 30, 0.4);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            animation: fadeIn 0.2s ease;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            background: #fffdf8;
            border-radius: 12px;
            padding: 28px 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
            animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #5a4a35;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 2px;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 20px;
            color: #998670;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #8b6f4e;
        }

        .modal-body p {
            font-size: 14px;
            color: #6b5a45;
            line-height: 1.8;
            margin-bottom: 8px;
        }

        .modal-body p span {
            color: #8b6f4e;
            font-weight: 500;
        }

        /* ========== 动画与全局细节 ========== */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        ::selection {
            background: #d4c4a8;
            color: #5a4a35;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #d4c4a8;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body>
    <!-- 顶部 -->
    <div class="header">
        <div class="header-left">
            <h2>学军紫金港2025届4班 · 毕业地图</h2>
            <p>班主任：王畅</p>
        </div>
        <div class="header-right">
            <span class="user-info" id="currentUserName"></span>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </div>

    <!-- 主体 -->
    <div class="main">
        <!-- 地图 -->
        <div class="map-container">
            <button class="map-back-btn" id="backBtn" onclick="goBack()">← 返回上一级</button>
            <div class="map-loading" id="mapLoading">地图加载中...</div>
            <div id="map"></div>
            <div class="map-stats">
                <div class="en">PEOPLE AROUND THE WORLD</div>
                <div class="cn">在地球上遇见<span class="count" id="totalCount">0</span>各位</div>
            </div>
        </div>

        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="tab-bar">
                <div class="tab-item active" onclick="switchTab('classmates')">同学列表</div>
                <div class="tab-item" onclick="switchTab('self')">我的信息</div>
                <div class="tab-item admin-tab" id="adminTab" onclick="switchTab('admin')">用户管理</div>
            </div>

            <!-- 同学列表面板 -->
            <div id="classmatesPanel">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索同学姓名..." oninput="filterClassmates(this.value)">
                </div>
                <div class="classmates-list" id="classmatesList"></div>
            </div>

            <!-- 个人信息面板 -->
            <div id="selfPanel" style="display:none;">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="editName">
                </div>
                <div class="form-group">
                    <label>国家</label>
                    <input type="text" id="editCountry">
                </div>
                <div class="form-group">
                    <label>省份</label>
                    <input type="text" id="editProvince" placeholder="国内填写">
                </div>
                <div class="form-group">
                    <label>城市</label>
                    <input type="text" id="editCity">
                </div>
                <div class="form-group">
                    <label>区县</label>
                    <input type="text" id="editDistrict" placeholder="国内填写">
                </div>
                <div class="form-group">
                    <label>毕业留言</label>
                    <textarea id="editMessage"></textarea>
                </div>
                <button class="save-btn" id="saveSelfBtn" onclick="saveSelfInfo()">保存修改</button>
                <button class="cancel-btn" onclick="showChangePwdModal()">修改密码</button>
            </div>

            <!-- 管理员面板 -->
            <div id="adminPanel" style="display:none;">
                <button class="add-user-btn" onclick="showAddModal()">+ 新增用户</button>
                <div class="user-list" id="userList"></div>
            </div>
        </div>
    </div>

    <!-- 管理员编辑用户弹窗 -->
    <div class="modal-mask" id="adminEditModal" onclick="if(event.target===this) closeAdminModal()">
        <div class="modal-content">
            <div class="modal-title">编辑用户信息</div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="adminEditName">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="text" id="adminEditPassword" placeholder="留空则不修改密码">
                <div class="form-tip">仅需修改密码时填写，留空保持原密码不变</div>
            </div>
            <div class="form-group">
                <label>国家</label>
                <input type="text" id="adminEditCountry">
            </div>
            <div class="form-group">
                <label>省份</label>
                <input type="text" id="adminEditProvince">
            </div>
            <div class="form-group">
                <label>城市</label>
                <input type="text" id="adminEditCity">
            </div>
            <div class="form-group">
                <label>区县</label>
                <input type="text" id="adminEditDistrict">
            </div>
            <div class="form-group">
                <label>毕业留言</label>
                <textarea id="adminEditMessage"></textarea>
            </div>
            <div class="modal-btns">
                <button class="cancel-btn" onclick="closeAdminModal()">取消</button>
                <button class="save-btn" id="saveAdminBtn" onclick="saveAdminEdit()">保存</button>
            </div>
        </div>
    </div>

    <!-- 个人修改密码弹窗 -->
    <div class="modal-mask" id="changePwdModal" onclick="if(event.target===this) closeChangePwdModal()">
        <div class="modal-content" style="width: 360px;">
            <div class="modal-title">修改密码</div>
            <div class="form-group">
                <label>旧密码</label>
                <input type="password" id="oldPwd" placeholder="请输入当前密码">
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="newPwd" placeholder="请输入新密码">
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" id="confirmNewPwd" placeholder="请再次输入新密码">
            </div>
            <div class="modal-btns">
                <button class="cancel-btn" onclick="closeChangePwdModal()">取消</button>
                <button class="save-btn" id="changePwdBtn" onclick="submitChangePwd()">确认修改</button>
            </div>
        </div>
    </div>

        // ========== 点位大小分级规则 ==========
        function getSymbolSize(val, params) {
            if (mapLevel === 'world') return 10;
            if (mapLevel === 'country') return 14;
            if (mapLevel === 'province') {
                const cityName = params.data?.city;
                if (!cityName) return 10;
                const count = allPoints.filter(p => p.city === cityName).length;
                return 8 + count * 3;
            }
            if (mapLevel === 'city') {
                const districtName = params.data?.district;
                if (!districtName) return 10;
                const count = allPoints.filter(p => p.district === districtName).length;
                return 8 + count * 3;
            }
            return 10;
        }

        // ========== 名称简化工具 ==========
        function shortName(name) {
            if (!name) return '';
            return name
                .replace('省', '').replace('市', '').replace('自治区', '')
                .replace('特别行政区', '').replace('壮族', '').replace('回族', '')
                .replace('维吾尔', '');
        }

        // ========== 数据聚合函数 ==========
        function formatWorldPoints() {
            const cityMap = {};
            allPoints.forEach(p => {
                const cityName = p.city || p.province || '未知';
                if (!cityMap[cityName]) {
                    cityMap[cityName] = {
                        name: cityName,
                        value: cityCoords[cityName] || cityCoords[p.province] || [104, 35]
                    };
                }
            });
            return Object.values(cityMap);
        }

        function formatProvincePoints() {
            const provinceMap = {};
            allPoints.forEach(p => {
                if (p.country === '中国' && p.province) {
                    if (!provinceMap[p.province]) {
                        provinceMap[p.province] = {
                            name: p.province,
                            value: provinceCoords[p.province] || [104, 35]
                        };
                    }
                }
            });
            return Object.values(provinceMap);
        }

        function formatCityPoints() {
            const cityMap = {};
            const targetShort = shortName(currentProvinceName);

            allPoints.forEach(p => {
                if (!p.city) return;
                const provShort = shortName(p.province || '');
                if (currentProvinceName && provShort !== targetShort && targetShort !== provShort) return;

                const cityName = p.city.trim();
                if (!cityMap[cityName]) {
                    cityMap[cityName] = {
                        name: cityName,
                        value: cityCoords[cityName] || [120.15, 30.27],
                        city: cityName
                    };
                }
            });
            return Object.values(cityMap);
        }

        function formatDistrictPoints() {
            const districtMap = {};
            const targetShort = shortName(currentCityName);

            allPoints.forEach(p => {
                if (!p.district || p.district.trim() === '') return;
                const cityShort = shortName(p.city || '');
                if (currentCityName && cityShort !== targetShort && targetShort !== cityShort) return;

                const districtName = p.district.trim();
                if (!districtMap[districtName]) {
                    districtMap[districtName] = {
                        name: districtName,
                        value: districtCoords[districtName] || cityCoords[p.city] || [120.15, 30.27],
                        district: districtName
                    };
                }
            });
            return Object.values(districtMap);
        }

        // ========== 同学列表渲染 + 搜索过滤 ==========
        function renderClassmatesList(keyword = '') {
            const container = document.getElementById('classmatesList');
            const list = [];
            const kw = keyword.trim().toLowerCase();

            allPoints.forEach((p, i) => {
                if (p.username !== currentUser.username) {
                    // 关键词匹配
                    if (kw && !p.name.toLowerCase().includes(kw)) return;
                    list.push({ ...p, index: i });
                }
            });

            if (list.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#998670;padding:40px 0;font-size:13px;">未找到匹配的同学</div>';
                return;
            }

            container.innerHTML = list.map(u => `
                <div class="classmate-item" data-index="${u.index}" onclick="locateStudentByIndex(this)">
                    <div class="classmate-name">${u.name}</div>
                    <div class="classmate-loc">${u.country} ${u.province || ''} ${u.city || ''}</div>
                    <div class="classmate-msg">${u.message || '暂无留言'}</div>
                </div>
            `).join('');
        }

        function filterClassmates(keyword) {
            // 搜索防抖
            if (searchTimer) clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                renderClassmatesList(keyword);

        }

        // ========== 定位到指定同学 ==========
        function locateStudentByIndex(el) {
            const idx = el.dataset.index;
            const student = allPoints[idx];
            if (student) locateStudent(student);
        }

        function locateStudent(student) {
            // 清除旧的定位定时器
            if (locateTimer) clearTimeout(locateTimer);
            if (highlightTimer) clearTimeout(highlightTimer);

            const country = student.country || '';
            const province = student.province || '';
            const city = student.city || '';
            const district = student.district || '';

            // 获取最优坐标
            let coord = null;
            let highlightName = '';
            if (district && districtCoords[district]) {
                coord = districtCoords[district];
                highlightName = district;
            } else if (city && cityCoords[city]) {
                coord = cityCoords[city];
                highlightName = city;
            } else if (province && provinceCoords[province]) {
                coord = provinceCoords[province];
                highlightName = province;
            } else if (cityCoords[city]) {
                coord = cityCoords[city];
                highlightName = city;
            }

            if (!coord) {
                alert('该同学位置信息不完整，无法定位');
                return;
            }

            // 国外：世界地图定位
            if (country !== '中国') {
                renderWorldMap();
                locateTimer = setTimeout(() => {
                    mapChart.setOption({ geo: { center: coord, zoom: 3 } });
                    highlightPoint(highlightName);
                }, 200);
                return;
            }

            // 国内无省份：中国地图定位
            if (!province) {
                loadChinaMap();
                locateTimer = setTimeout(() => {
                    mapChart.setOption({ geo: { center: coord, zoom: 2 } });
                    highlightPoint(highlightName);
                }, 500);
                return;
            }

            // 匹配省份adcode
            const provAdcode = provinceAdcodeMap[province];
            if (!provAdcode) {
                loadChinaMap();
                locateTimer = setTimeout(() => {
                    mapChart.setOption({ geo: { center: coord, zoom: 2 } });
                    highlightPoint(highlightName);
                }, 500);
                return;
            }

            // 有省份无城市：省级地图定位
            if (!city) {
                loadProvinceMap(provAdcode, province);
                locateTimer = setTimeout(() => {
                    mapChart.setOption({ geo: { center: coord, zoom: 1.6 } });
                    highlightPoint(highlightName);
                }, 500);
                return;
            }

            // 有城市无区县：省级地图定位到城市
            if (!district) {
                loadProvinceMap(provAdcode, province);
                locateTimer = setTimeout(() => {
                    mapChart.setOption({ geo: { center: coord, zoom: 2.2 } });
                    highlightPoint(highlightName);
                }, 500);
                return;
            }

            // 有区县：下钻到市级地图定位
            loadProvinceMap(provAdcode, province);
            locateTimer = setTimeout(() => {
                const cityAdcode = getAdcodeByName(currentGeoJson, city);
                if (cityAdcode) {
                    loadCityMap(cityAdcode, city);
                    locateTimer = setTimeout(() => {
                        mapChart.setOption({ geo: { center: coord, zoom: 2.5 } });
                        highlightPoint(highlightName);
                    }, 500);
                } else {
                    mapChart.setOption({ geo: { center: coord, zoom: 2.2 } });
                    highlightPoint(highlightName);
                }
            }, 500);
        }

            if (!name || !mapChart) return;

        // ========== 返回上一级 ==========
        function goBack() {
            if (locateTimer) clearTimeout(locateTimer);
            if (highlightTimer) clearTimeout(highlightTimer);

            if (mapLevel === 'city') {
                currentCityName = '';
                if (!currentGeoJson || !currentGeoJson.features || currentGeoJson.features.length === 0) {
                    loadChinaMap();
                    return;
                }
                const cityCode = currentGeoJson.features[0].properties.adcode;
                const provCode = String(cityCode).slice(0, 2) + '0000';
                loadProvinceMap(provCode, currentProvinceName);
            } else if (mapLevel === 'province') {
                currentProvinceName = '';
                loadChinaMap();
            } else if (mapLevel === 'country') {
                renderWorldMap();
                bindWorldClick();
            }
        }

                }
            }
            return null;
        }

        function saveSelfInfo() {
            const btn = document.getElementById('saveSelfBtn');
            btn.disabled = true;
            btn.textContent = '保存中...';

            const data = {
                name: document.getElementById('editName').value,
                country: document.getElementById('editCountry').value,
                province: document.getElementById('editProvince').value,
                city: document.getElementById('editCity').value,
                district: document.getElementById('editDistrict').value,
                message: document.getElementById('editMessage').value
            };

            fetch(`/api/user/self?username=${currentUser.username}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(res => {
                btn.disabled = false;
                btn.textContent = '保存修改';
                if (res.code === 200) {
                    alert('保存成功');
                    currentUser = res.data;
                    localStorage.setItem('currentUser', JSON.stringify(res.data));
                    document.getElementById('currentUserName').textContent =
                        currentUser.name + '（' + (currentUser.role === 'admin' ? '管理员' : '成员') + '）';
                    loadMapPoints();
                } else {
                    alert(res.msg);
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.textContent = '保存修改';
                alert('保存失败，请检查网络');
            });
        }

        // ========== 个人修改密码 ==========
        function showChangePwdModal() {
            document.getElementById('oldPwd').value = '';
            document.getElementById('newPwd').value = '';
            document.getElementById('confirmNewPwd').value = '';
            document.getElementById('changePwdModal').style.display = 'block';
        }

        function closeChangePwdModal() {
            document.getElementById('changePwdModal').style.display = 'none';
        }

        function submitChangePwd() {
            const oldPwd = document.getElementById('oldPwd').value.trim();
            const newPwd = document.getElementById('newPwd').value.trim();
            const confirmPwd = document.getElementById('confirmNewPwd').value.trim();
            const btn = document.getElementById('changePwdBtn');

            if (!oldPwd || !newPwd || !confirmPwd) {
                alert('请填写完整密码信息');
                return;
            }
            if (newPwd !== confirmPwd) {
                alert('两次输入的新密码不一致');
                return;
            }
            if (newPwd.length < 6) {
                alert('新密码长度不能少于6位');
                return;
            }

            btn.disabled = true;
            btn.textContent = '修改中...';

            fetch('/api/user/change-password', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: currentUser.username,
                    oldPassword: oldPwd,
                    newPassword: newPwd
                })
            })
            .then(res => res.json())
            .then(res => {
                btn.disabled = false;
                btn.textContent = '确认修改';
                if (res.code === 200) {
                    alert('密码修改成功，请重新登录');
                    closeChangePwdModal();
                    logout();
                } else {
                    alert(res.msg || '密码修改失败');
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.textContent = '确认修改';
                alert('修改失败，请检查网络');
            });
        }

        // ========== 标签切换 ==========
        function switchTab(type) {
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.getElementById('classmatesPanel').style.display = 'none';
            document.getElementById('selfPanel').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'none';

            if (type === 'classmates') {
                document.querySelector('.tab-item:nth-child(1)').classList.add('active');
                document.getElementById('classmatesPanel').style.display = 'block';
            } else if (type === 'self') {
                document.querySelector('.tab-item:nth-child(2)').classList.add('active');
                document.getElementById('selfPanel').style.display = 'block';
            } else {
                document.querySelector('.tab-item:nth-child(3)').classList.add('active');
                document.getElementById('adminPanel').style.display = 'block';
                loadAdminUserList();
            }
        }

        // ========== 管理员功能 ==========
        function loadAdminUserList() {
            fetch(`/api/admin/users?admin_name=${currentUser.username}`)
                .then(res => res.json())
                .then(res => {
                    if (res.code === 200) {
                        adminUserList = res.data;
                        renderUserList(res.data);
                    }
                });
        }

        function renderUserList(users) {
            const container = document.getElementById('userList');
            container.innerHTML = users.map(u => `
                <div class="user-item">
                    <div class="name-row">
                        <span class="name">${u.name}</span>
                        <span class="role">${u.role === 'admin' ? '管理员' : '成员'}</span>
                    </div>
                    <div class="loc">${u.country} ${u.province || ''} ${u.city || ''} ${u.district || ''}</div>
                    <div class="ops">
                        <button onclick="editUser('${u.username}')">编辑</button>
                        <button onclick="resetUserPwd('${u.username}')">重置密码</button>
                        <button onclick="deleteUser('${u.username}')">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 打开编辑弹窗
        function editUser(username) {
            let user = adminUserList.find(u => u.username === username);
            if (!user) {
                user = allPoints.find(p => p.username === username);
            }

            if (!user) {
                alert('未找到对应用户信息，请刷新页面重试');
                return;
            }

            currentEditUsername = username;
            document.getElementById('adminEditName').value = user.name || '';
            document.getElementById('adminEditPassword').value = '';
            document.getElementById('adminEditCountry').value = user.country || '';
            document.getElementById('adminEditProvince').value = user.province || '';
            document.getElementById('adminEditCity').value = user.city || '';
            document.getElementById('adminEditDistrict').value = user.district || '';
            document.getElementById('adminEditMessage').value = user.message || '';

            document.getElementById('adminEditModal').style.display = 'block';
        }

        // 快速重置密码
        function resetUserPwd(username) {
            const newPwd = prompt('请输入新密码', '1233456');
            if (!newPwd) return;

            fetch(`/api/admin/users/${username}?admin_name=${currentUser.username}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: newPwd })
            })
            .then(res => res.json())
            .then(res => {
                alert(res.msg || '重置成功');
            });
        }

        // 关闭编辑弹窗
        function closeAdminModal() {
            document.getElementById('adminEditModal').style.display = 'none';
            currentEditUsername = '';
        }

        // 保存管理员编辑
        function saveAdminEdit() {
            if (!currentEditUsername) return;

            const btn = document.getElementById('saveAdminBtn');
            btn.disabled = true;
            btn.textContent = '保存中...';

            const data = {
                name: document.getElementById('adminEditName').value,
                country: document.getElementById('adminEditCountry').value,
                province: document.getElementById('adminEditProvince').value,
                city: document.getElementById('adminEditCity').value,
                district: document.getElementById('adminEditDistrict').value,
                message: document.getElementById('adminEditMessage').value
            };

            // 密码非空时才传递
            const pwdVal = document.getElementById('adminEditPassword').value.trim();
            if (pwdVal) {
                data.password = pwdVal;
            }

            fetch(`/api/admin/users/${currentEditUsername}?admin_name=${currentUser.username}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(res => {
                btn.disabled = false;
                btn.textContent = '保存';
                if (res.code === 200) {
                    alert('修改成功');
                    closeAdminModal();
                    loadAdminUserList();
                    loadMapPoints();
                    // 如果修改的是当前登录用户，同步更新本地信息
                    if (currentEditUsername === currentUser.username) {
                        currentUser = { ...currentUser, ...data };
                        localStorage.setItem('currentUser', JSON.stringify(currentUser));
                        document.getElementById('currentUserName').textContent =
                            currentUser.name + '（' + (currentUser.role === 'admin' ? '管理员' : '成员') + '）';
                        loadSelfInfo();
                    }
                } else {
                    alert(res.msg);
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.textContent = '保存';
                alert('保存失败，请检查接口或本地服务');
                console.error(err);
            });
        }

        function showAddModal() {
            const username = prompt('请输入新用户账号：');
            if (!username) return;
            const password = prompt('请设置初始密码：', '1233456');
            if (!password) return;
            const name = prompt('请输入用户姓名：');
            if (!name) return;

            fetch(`/api/admin/users?admin_name=${currentUser.username}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, name, country: '中国' })
            })
            .then(res => res.json())
            .then(res => {
                alert(res.msg);
                if (res.code === 200) {
                    loadAdminUserList();
                    loadMapPoints();
                }
            });
        }

        function deleteUser(username) {
            if (!confirm('确定要删除该用户吗？删除后不可恢复')) return;
            fetch(`/api/admin/users/${username}?admin_name=${currentUser.username}`, {
                method: 'DELETE'
            })
            .then(res => res.json())
            .then(res => {
                alert(res.msg);
                loadAdminUserList();
                loadMapPoints();
            });
        }

        // ========== 退出登录 ==========
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/';
        }
    </script>
</body>
</html>
