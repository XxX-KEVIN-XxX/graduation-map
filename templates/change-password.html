<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毕业地图 · 修改密码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5efe6;
            font-family: "Songti SC", "SimSun", "Microsoft YaHei", serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(#e8dccc 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .card {
            width: 400px;
            padding: 50px 40px;
            background: #fffdf8;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(139, 119, 91, 0.15);
            border: 1px solid #e8dccc;
        }
        .title {
            text-align: center;
            margin-bottom: 40px;
        }
        .title h1 {
            font-size: 28px;
            color: #5a4a35;
            font-weight: 500;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }
        .title p {
            font-size: 13px;
            color: #998670;
            letter-spacing: 2px;
        }
        .form-item {
            margin-bottom: 22px;
        }
        .form-item label {
            display: block;
            font-size: 14px;
            color: #7a6a55;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .form-item input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #d9cbb8;
            border-radius: 6px;
            background: #faf7f2;
            font-size: 14px;
            color: #5a4a35;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }
        .form-item input:focus {
            border-color: #b89770;
            background: #fff;
        }
        .submit-btn {
            width: 100%;
            height: 46px;
            margin-top: 10px;
            background: #8b6f4e;
            color: #fffdf8;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            letter-spacing: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        .submit-btn:hover {
            background: #7a5f40;
        }
        .back-link {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #b09e88;
        }
        .back-link a {
            color: #8b6f4e;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">
            <h1>修改密码</h1>
            <p>CHANGE PASSWORD</p>
        </div>

        <div class="form-item">
            <label>原密码</label>
            <input type="password" id="oldPassword" placeholder="请输入原密码">
        </div>

        <div class="form-item">
            <label>新密码</label>
            <input type="password" id="newPassword" placeholder="请输入新密码">
        </div>

        <div class="form-item">
            <label>确认新密码</label>
            <input type="password" id="confirmPassword" placeholder="请再次输入新密码">
        </div>

        <button class="submit-btn" onclick="handleChange()">确认修改</button>

        <div class="back-link">
            <a href="/index">← 返回地图首页</a>
        </div>
    </div>

    <script>
        // 未登录则跳转
        if (!localStorage.getItem('currentUser')) {
            window.location.href = '/login';
        }

        function handleChange() {
            const oldPassword = document.getElementById('oldPassword').value.trim();
            const newPassword = document.getElementById('newPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            if (!oldPassword || !newPassword || !confirmPassword) {
                alert('请填写全部密码项');
                return;
            }
            if (newPassword !== confirmPassword) {
                alert('两次输入的新密码不一致');
                return;
            }
            if (newPassword.length < 6) {
                alert('新密码长度不能少于6位');
                return;
            }

            fetch('/api/user/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    old_password: oldPassword,
                    new_password: newPassword,
                    confirm_password: confirmPassword
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    alert(data.msg);
                    localStorage.removeItem('currentUser');
                    window.location.href = '/login';
                } else {
                    alert(data.msg);
                }
            })
            .catch(() => alert('请求失败，请检查后端服务'));
        }

        // 回车提交
        document.getElementById('confirmPassword').addEventListener('keydown', e => {
            if (e.key === 'Enter') handleChange();
        });
    </script>
</body>
</html>
